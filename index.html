<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Konsola Admina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap">
<style>
/* Układ: mało tekstu — kroki jako jedna linijka z „przyciskami” do kliknięcia, reszta schowana; tryb krok po kroku na pełnym ekranie */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --fg:#111923; --muted:#5A6576; --line:#D6DCE4;
  --srv:#0B7A66; --srv-soft:#DCF0EA; --lx:#A84A12; --lx-soft:#FBEADF; --w11:#2459D6; --w11-soft:#E1E9FB;
  --warn:#8F5300; --warn-soft:#FAEFD9; --ok:#1E7A3C; --ok-soft:#E0F2E6; --exam:#A2264B; --exam-soft:#FBE6EC;
  --code-bg:#0F1722; --code-fg:#DCE4EE; --code-muted:#8494A8; --code-line:#223044;
  --t-cmd:#7CC4FF; --t-par:#F2B36B; --t-str:#A9DA8C; --t-var:#E6A2E0; --t-com:#71809A;
  --f-head:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --acc:var(--w11); --acc-soft:var(--w11-soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#141B24; --surface-2:#1B2430; --fg:#E5EAF0; --muted:#9AA6B6; --line:#26303C;
  --srv:#3FC9AA; --srv-soft:#0F2E28; --lx:#FF9F66; --lx-soft:#3A2112; --w11:#86A9FF; --w11-soft:#172548;
  --warn:#F1B65E; --warn-soft:#30240F; --ok:#5BD07F; --ok-soft:#12301C; --exam:#FF8FAF; --exam-soft:#3A1622;
  --code-bg:#090E14; --code-line:#1C2735; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B24; --surface-2:#1B2430; --fg:#E5EAF0; --muted:#9AA6B6; --line:#26303C;
  --srv:#3FC9AA; --srv-soft:#0F2E28; --lx:#FF9F66; --lx-soft:#3A2112; --w11:#86A9FF; --w11-soft:#172548;
  --warn:#F1B65E; --warn-soft:#30240F; --ok:#5BD07F; --ok-soft:#12301C; --exam:#FF8FAF; --exam-soft:#3A1622;
  --code-bg:#090E14; --code-line:#1C2735; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.25;margin:0}
code,kbd{font-family:var(--f-mono);font-size:.86em}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
ul{margin:0;padding-left:20px}
/* elementy kroków */
.ui{display:inline-block;font-weight:600;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 8px;line-height:1.6;margin:1px 0}
.val{font-family:var(--f-mono);font-size:.9em;background:var(--acc-soft);color:var(--acc);border-radius:5px;padding:1px 7px;font-weight:500;white-space:nowrap}
.ar{color:var(--muted);margin:0 3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);flex-shrink:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 13px var(--f-mono)}
.brand b{font:700 16px var(--f-head)}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 12px 8px 34px;font:14px var(--f-body)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:17px;height:17px;stroke:var(--fg);fill:none;stroke-width:1.8}
#menuBtn{display:none}

.shell{display:grid;grid-template-columns:268px minmax(0,1fr)}
.side{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:18px 12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));background:var(--surface)}
.navgrp{margin-bottom:18px}
.navgrp h4{margin:0 0 6px;padding:0 10px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.navgrp a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.35}
.navgrp a:hover{background:var(--surface-2)}
.navgrp a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.navgrp a.ex{color:var(--exam);font-weight:600}
.navgrp a.ex.on{background:var(--exam-soft)}
.navgrp a .n{font:500 11px var(--f-mono);color:var(--muted);width:18px;flex-shrink:0}
.ck{margin-left:auto;width:15px;height:15px;flex-shrink:0;stroke:var(--ok);fill:none;stroke-width:2.4}
.backdrop{display:none}

main{padding-block:30px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* start */
.hero{display:flex;flex-direction:column;gap:8px}
.eyebrow{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hero h1{font-size:clamp(28px,4.4vw,38px);letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);font-size:17px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.how b{font-size:15px}
.examcta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--exam-soft);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--fg)}
.examcta b{font:600 17px var(--f-head);color:var(--exam);display:block}
.examcta span{font-size:14px;color:var(--muted)}
.examcta i{font-style:normal;font-weight:600;color:var(--exam)}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.course header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.course h2{font-size:18px}
.chip{display:inline-flex;align-items:center;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--acc-soft);color:var(--acc)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.course ol{list-style:none;margin:0;padding:0}
.course li a{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:14.5px}
.course li a:hover{color:var(--acc)}
.course li .n{font:500 12px var(--f-mono);color:var(--muted);width:20px;padding-top:2px}
.course li .ck{margin-top:4px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-decoration:none;color:var(--fg)}
.tool:hover{border-color:var(--fg)}
.tool b{font:600 15px var(--f-head)}
.tool span{color:var(--muted);font-size:14px}

/* lekcja */
.lhead{display:flex;flex-direction:column;gap:12px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.lhead h1{font-size:clamp(26px,3.6vw,32px);letter-spacing:-.015em}
.cel{margin:0;font-size:17px;color:var(--muted)}
.exrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exrow .lbl{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--exam);margin-right:4px}
.exrow span.p{background:var(--exam-soft);color:var(--exam);border-radius:999px;padding:2px 11px;font-size:13.5px;font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 16px;font-size:15px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:19px;display:flex;align-items:center;gap:10px}
.sec h2 small{font:500 12px var(--f-body);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:16px}
.rs,.wt{display:inline-block;font:600 12px var(--f-mono);padding:2px 8px;border-radius:6px;margin-right:4px;vertical-align:1px}
.rs{background:var(--exam-soft);color:var(--exam);border:1px solid var(--exam)}
.wt{background:var(--warn-soft);color:var(--warn)}
.steps li:has(.rs){background:var(--exam-soft)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.order h2{margin:0 0 10px;font-size:18px}
.order .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.6}
.order .row b{color:var(--muted);font-weight:600}
@media(max-width:560px){.order .row{grid-template-columns:1fr;gap:2px}}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:600 13px var(--f-mono)}
.tipbox{background:var(--warn-soft);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:15.5px}
.tipbox::before{content:"!";width:22px;height:22px;border-radius:50%;background:var(--warn);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.map h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 16px;background:var(--surface-2)}
.map div{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1.3fr);gap:8px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:15px}
.map div i{color:var(--muted);font-style:normal;text-align:center}
.check{background:var(--ok-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.check h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ok)}
.check ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:15.5px}
.check li::before{content:"✓";color:var(--ok);font-weight:700}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.more summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary span{font-weight:400;color:var(--muted);font-size:13px;margin-left:auto}
details.more summary::after{content:"+";font:600 18px var(--f-mono);color:var(--muted);line-height:1.2}
details.more[open] summary::after{content:"−"}
details.more .in{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;font-size:15px}
.errs{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.errs li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.errs li::before{content:"✕";color:var(--warn);font-weight:700}
.code{background:var(--code-bg);border-radius:10px;overflow:hidden;min-width:0}
.code-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--code-line);font:500 11.5px var(--f-mono);color:var(--code-muted)}
.copy{border:1px solid var(--code-line);background:transparent;color:var(--code-fg);border-radius:6px;padding:3px 10px;font:500 11.5px var(--f-mono)}
.copy.ok{color:var(--t-str);border-color:var(--t-str)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:13px/1.7 var(--f-mono);color:var(--code-fg)}
.code pre code{font-size:13px}
.t-cmd{color:var(--t-cmd)} .t-par{color:var(--t-par)} .t-str{color:var(--t-str)} .t-var{color:var(--t-var)} .t-com{color:var(--t-com);font-style:italic}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.pn a{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--fg);background:var(--surface)}
.pn a:hover{border-color:var(--acc)}
.pn a span{font-size:12px;color:var(--muted)}
.pn a b{font-weight:600;font-size:15px}
.pn a.nx{text-align:right;grid-column:2}

/* tryb krok po kroku */
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fbar{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.fbar b{font:600 15px var(--f-head);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fprog{height:4px;background:var(--surface-2)} .fprog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.fbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:720px;width:100%;margin:0 auto;padding-block:24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto}
.fsec{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.fnum{font:600 15px var(--f-mono);color:var(--muted)}
.ftext{font:500 clamp(22px,3.6vw,30px)/1.5 var(--f-body)}
.ftext .ui{font-size:.9em}
.fnav{display:flex;gap:12px;justify-content:space-between;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.fnav .btn{padding:12px 22px;font-size:16px}
.fhint{font-size:13px;color:var(--muted);align-self:center}

/* egzamin */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--surface-2)}
.task header h2{font-size:17px}
.task header span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.titem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 18px;border-top:1px solid var(--line);font-size:15px}
.titem input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ok)}
.titem.done label{color:var(--muted);text-decoration:line-through}
.titem a{font-size:13px;white-space:nowrap;text-decoration:none;font-weight:600}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rules div{background:var(--exam-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.rules b{color:var(--exam);font-size:15px}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;align-self:flex-start}

.soisk{background:var(--surface);border:2px solid var(--w11);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.soisk h2{margin:0 0 8px;font-size:17px;color:var(--w11)}
.sk{padding:10px 0;border-top:1px solid var(--line)}
.sk:first-of-type{border-top:0}
.skt{font-weight:600;font-size:15px}
.skt span{display:inline-block;font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:8px;vertical-align:2px}
.skl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.skl i{font-style:normal;color:var(--muted);font-size:13px;margin-right:2px}
.skl a{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);background:var(--surface-2);font-size:14px}
.skl a:hover{border-color:var(--acc,var(--w11))}
.soh{font-size:16px;margin:6px 0 10px}
.arkbox,.mybox{background:var(--surface);border:2px solid var(--exam);border-radius:12px;padding:16px 18px;margin:18px 0}
.mybox{border-color:var(--line)}
.arkbox h2,.mybox h2{margin:0 0 6px;font-size:19px}
.arkbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px var(--f-mono);background:var(--surface-2);color:var(--fg);resize:vertical}
.arkbtns{display:flex;gap:8px;margin:10px 0 4px}
.arkres{margin-top:12px;display:flex;flex-direction:column;gap:14px}
.nolink{color:var(--muted);font-size:13px;white-space:nowrap}
.myf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.myf label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.myf input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--f-mono);background:var(--surface-2);color:var(--fg)}
.myon{display:flex;gap:8px;align-items:center;font-weight:600}

   R`{Adres IP}: «192.168.10.10»`,
   R`{Maska podsieci}: kliknij w pole, sama wpisze się «255.255.255.0». Sprawdź z arkuszem`,
   R`{Brama domyślna}: «192.168.10.1» (arkusz nie podaje? zostaw puste)`,
   R`{Preferowany serwer DNS}: adres TEGO serwera «192.168.10.10» (albo «127.0.0.1»)`,
   R`{OK} > {Zamknij}. Tu restart nie jest potrzebny`]]],
 tip:R`Maska: /24 = «255.255.255.0», /16 = «255.255.0.0», /8 = «255.0.0.0»`,
 check:[R`Terminal: «ipconfig /all»`,R`«ping 192.168.10.1» odpowiada`],
 pam:'Kolejność: NAZWA → IP → restart → dopiero DOMENA. Jak w życiu: imię, adres, potem ślub.',
 errs:[['Zła maska (np. /16 wpisana jako 255.255.255.0)','Policz: /8 = 255.0.0.0, /16 = 255.255.0.0, /24 = 255.255.255.0. Popraw we właściwościach IPv4.'],
  ['DNS ustawiony na 8.8.8.8','Serwer ma DNS na siebie: swój adres (np. 192.168.10.10) albo 127.0.0.1.'],
  ['Brak restartu po zmianie nazwy','Nazwa działa dopiero po restarcie. Uruchom ponownie.'],
  ['Nazwa zmieniona po zrobieniu domeny','Lepiej nie. Jeśli już: sysdm.cpl > Zmień… > restart. Potem sprawdź w DNS rekord A serwera.'],
  ['Adres na złej karcie (np. NAT)','ncpa.cpl: ustaw IP na karcie podłączonej do „Sieci wewnętrznej” w VirtualBox.'],
  ['„Adres IP jest już przypisany do innej karty”','Kliknij Tak (usunie stary wpis) albo wybierz inny adres.']],
 extra:[['table',['Prefiks','Maska'],[['/8','255.0.0.0'],['/16','255.255.0.0'],['/24','255.255.255.0'],['/25','255.255.255.128'],['/26','255.255.255.192'],['/27','255.255.255.224'],['/28','255.255.255.240']]]],
 cmds:[['ps',R`Rename-Computer -NewName "SRV01" -Restart
New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress 192.168.10.10 -PrefixLength 24 -DefaultGateway 192.168.10.1
Set-DnsClientServerAddress -InterfaceAlias "Ethernet" -ServerAddresses 192.168.10.10`]]},

{id:'ws-ad', os:'ws', t:'Domena (Active Directory)',
 fields:[['Konfiguracja wdrożenia',[['Nazwa domeny głównej','szkola.local']]],
  ['Opcje kontrolera domeny',[['Hasło','hasło DSRM z arkusza'],['Potwierdź hasło','to samo hasło']]],
  ['Opcje dodatkowe',[['Nazwa domeny NetBIOS','SZKOLA (wpisze się samo)']]]],
 cel:'Serwer zostaje szefem domeny. Prawie zawsze jest w arkuszu.',
 exam:['rola AD DS','nazwa domeny','hasło DSRM'],
 sec:[
  ['0. Zanim zaczniesz',[
   R`Musi być zrobione: nazwa SRV01 (po restarcie) i stały IP z DNS na siebie`,
   R`Hasło Administratora musi być złożone (np. «Zaq12wsx!»), inaczej kreator nie przejdzie`]],
  ['1. Zainstaluj rolę AD DS',[
   R`{Menedżer serwera} > u góry po prawej {Zarządzaj} > {Dodaj role i funkcje}`,
   R`Strona {Zanim rozpoczniesz} > {Dalej}`,
   R`{Typ instalacji}: zostaw {Instalacja oparta na rolach lub oparta na funkcjach} > {Dalej}`,
   R`{Wybór serwera}: zaznaczony SRV01 > {Dalej}`,
   R`{Role serwera}: zaznacz {Usługi domenowe w usłudze Active Directory}`,
   R`Wyskoczy okienko > {Dodaj funkcje}`,
   R`{Dalej} (Funkcje) > {Dalej} (AD DS) > {Dalej}`,
   R`{Potwierdzenie} > {Zainstaluj}`,
   R`⏳ Czekaj na pasek (2–5 min) > {Zamknij}. Restartu jeszcze NIE ma`]],
  ['2. Podwyższ do kontrolera domeny',[
   R`U góry {Menedżera serwera} kliknij {flagę} z żółtym trójkątem`,
   R`Kliknij niebieski link {Podwyższ poziom tego serwera do kontrolera domeny}`,
   R`{Konfiguracja wdrożenia}: zaznacz {Dodaj nowy las}`,
   R`{Nazwa domeny głównej}: «szkola.local» (z arkusza, sprawdź literówki!) > {Dalej}`,
   R`{Opcje kontrolera domeny}: zostaw zaznaczone {Serwer DNS (Domain Name System)} i {Wykaz globalny (GC)}`,
   R`{Hasło} i {Potwierdź hasło}: hasło DSRM z arkusza > {Dalej}`,
   R`{Opcje DNS}: żółte ostrzeżenie o delegowaniu to normalne > {Dalej}`,
   R`{Opcje dodatkowe}: nazwa NetBIOS «SZKOLA» wpisze się sama, poczekaj > {Dalej}`,
   R`{Ścieżki} > {Dalej} > {Przegląd opcji} > {Dalej}`,
   R`{Sprawdzenie wymagań wstępnych}: ma być zielony ptaszek > {Zainstaluj}`,
   R`⟳ RESTART sam. Nic nie klikaj, czekaj (5–10 min)`,
   R`Logowanie po restarcie: «SZKOLA\Administrator», to samo hasło`]]],
 tip:R`Sprawdź nazwę domeny dwa razy. Literówki nie da się łatwo poprawić.`,
 check:[R`{Narzędzia} > {Użytkownicy i komputery usługi Active Directory}: widać domenę`,R`Logujesz się jako «SZKOLA\Administrator»`],
 pam:'Dwa etapy: 1) zainstaluj rolę AD DS, 2) kliknij FLAGĘ i podwyższ. DSRM = hasło ratunkowe.',
 errs:[['Brak stałego IP przed instalacją','Ustaw stały adres (lekcja 1), dopiero potem podwyższ serwer.'],
  ['„Hasło Administratora nie spełnia wymagań”','Ustaw lokalnemu Administratorowi hasło złożone, np. Zaq12wsx!, i powtórz.'],
  ['Rola jest, domeny nie ma','Zapomniana flaga. Kliknij flagę u góry Menedżera serwera > Podwyższ poziom…'],
  ['Literówka w nazwie domeny','Najszybciej: przywróć migawkę maszyny. Zmiana nazwy domeny jest trudna.'],
  ['Żółte ostrzeżenia o delegowaniu DNS','To normalne w pracowni. Kliknij Dalej.'],
  ['Po restarcie nie da się zalogować','Login to teraz SZKOLA\\Administrator, hasło to samo co wcześniej.']],
 cmds:[['ps',R`Install-WindowsFeature AD-Domain-Services -IncludeManagementTools
Install-ADDSForest -DomainName "szkola.local" -InstallDns`]]},

{id:'ws-uzytkownicy', os:'ws', t:'Użytkownicy, grupy i OU',
 fields:[['Nowy obiekt — Jednostka organizacyjna',[['Nazwa','Uczniowie']]],
  ['Nowy obiekt — Użytkownik (strona 1)',[['Imię','Jan'],['Nazwisko','Kowalski'],['Nazwa logowania użytkownika','jkowalski']]],
  ['Nowy obiekt — Użytkownik (strona 2)',[['Hasło','hasło z arkusza'],['Potwierdź hasło','to samo hasło']]],
  ['Nowy obiekt — Grupa',[['Nazwa grupy','klasa2'],['Zakres grupy','Globalny'],['Typ grupy','Zabezpieczenia']]]],
 cel:'Najczęstsze zadanie w arkuszu.',
 exam:['jednostka OU','konto','hasło','wygaśnięcie','godziny logowania','grupa'],
 sec:[
  ['1. Otwórz konsolę',[
   R`{Menedżer serwera} > {Narzędzia} (u góry po prawej) > {Użytkownicy i komputery usługi Active Directory}`,
   R`Po lewej rozwiń strzałką {szkola.local}`]],
  ['2. Jednostka organizacyjna (OU)',[
   R`Prawy klik na {szkola.local} > {Nowy} > {Jednostka organizacyjna}`,
   R`{Nazwa}: «Uczniowie»`,
   R`Zostaw {Chroń kontener przed przypadkowym usunięciem} > {OK}`]],
  ['3. Konto użytkownika',[
   R`Prawy klik na OU {Uczniowie} > {Nowy} > {Użytkownik}`,
   R`{Imię}: «Jan», {Nazwisko}: «Kowalski»`,
   R`{Nazwa logowania użytkownika}: «jkowalski» > {Dalej}`,
   R`{Hasło} i {Potwierdź hasło}: hasło z arkusza`,
   R`Arkusz: „zmiana hasła przy logowaniu” = zostaw {Użytkownik musi zmienić hasło przy następnym logowaniu}`,
   R`Arkusz: „nie może zmienić” = odznacz górny, zaznacz {Użytkownik nie może zmienić hasła}`,
   R`Arkusz: „hasło nie wygasa” = {Hasło nigdy nie wygasa}; „konto wyłączone” = {Konto jest wyłączone}`,
   R`{Dalej} > {Zakończ}`,
   R`Błąd o haśle? Za proste. Wpisz złożone, np. «Zaq12wsx!»`]],
  ['4. Wygaśnięcie konta',[
   R`Dwuklik na koncie {Jan Kowalski} > zakładka {Konto}`,
   R`Na dole {Wygasanie konta}: zaznacz {Koniec:}`,
   R`Wybierz datę z kalendarza > {Zastosuj}`]],
  ['5. Godziny logowania',[
   R`Ta sama zakładka {Konto} > {Godziny logowania…}`,
   R`Kliknij {Wszystkie} (lewy górny róg tabeli) > {Odmowa logowania}`,
   R`Przeciągnij myszką dozwolone godziny (np. pon–pt 8–16) > {Zezwalaj na logowanie}`,
   R`{OK} > {OK}`]],
  ['6. Grupa',[
   R`Prawy klik na OU {Uczniowie} > {Nowy} > {Grupa}`,
   R`{Nazwa grupy}: «klasa2»`,
   R`{Zakres grupy}: {Globalny} (zwykle) albo {Lokalny w domenie} (jeśli arkusz tak mówi)`,
   R`{Typ grupy}: {Zabezpieczenia} > {OK}`]],
  ['7. Użytkownik do grupy',[
   R`Dwuklik na grupie {klasa2} > zakładka {Członkowie} > {Dodaj…}`,
   R`Wpisz «jkowalski» > {Sprawdź nazwy} (podkreśli się) > {OK}`,
   R`{OK} zamyka okno grupy`]]],
 map:{t:'Arkusz mówi → zaznacz',rows:[
   ['zmiana hasła przy pierwszym logowaniu',R`{Użytkownik musi zmienić hasło przy następnym logowaniu}`],
   ['nie może zmieniać hasła',R`{Użytkownik nie może zmienić hasła}`],
   ['hasło bez terminu ważności',R`{Hasło nigdy nie wygasa}`],
   ['konto wyłączone / nieaktywne',R`{Konto jest wyłączone}`]]},
 tip:R`Proste hasło z arkusza nie przechodzi? Najpierw wyłącz złożoność haseł (następna lekcja).`,
 check:[R`Konto i grupa są w OU`,R`Logowanie na kliencie tym kontem działa`],
 pam:'„MUSI zmienić” = przy następnym logowaniu. Grupa GLOBALNA = ludzie, LOKALNA w domenie = prawa do zasobów.',
 errs:[['Konto w folderze Users zamiast w OU','Prawy klik na koncie > Przenieś… > wybierz OU.'],
  ['„Hasło nie spełnia wymagań”','Wyłącz złożoność w Default Domain Policy (lekcja Zasady haseł) albo daj hasło typu Zaq12wsx!.'],
  ['Zaznaczone „musi zmienić” i „nie może zmienić” naraz','Windows na to nie pozwala. Zostaw tylko to, co w arkuszu.'],
  ['Pomylony zakres grupy','Dwuklik na grupie > Ogólne > zmień zakres.'],
  ['Literówka w loginie','Dwuklik > zakładka Konto > popraw oba pola nazwy logowania.'],
  ['Konto wyłączone (strzałka w dół na ikonie)','Prawy klik > Włącz konto.'],
  ['Brak zakładek, np. Edytor atrybutów','Widok > Funkcje zaawansowane.']],
 extra:[['p',R`Szybciej kilka kont: prawy klik na gotowym koncie > {Kopiuj…}. Kopia ma te same grupy i ustawienia.`]],
 cmds:[['ps',R`New-ADOrganizationalUnit -Name "Uczniowie"
New-ADUser -Name "Jan Kowalski" -SamAccountName "jkowalski" -Path "OU=Uczniowie,DC=szkola,DC=local" -AccountPassword (Read-Host -AsSecureString) -ChangePasswordAtLogon $true -Enabled $true`]]},

{id:'ws-delegowanie', os:'ws', t:'Delegowanie kontroli',

 exam:['deleguj kontrolę','reset haseł','zarządzanie kontami w OU'],
 sec:[

{id:'ws-hasla', os:'ws', t:'Zasady haseł i blokady',
 cel:'Długość hasła, złożoność, blokada po złych próbach.',
 exam:['min. długość','złożoność','ważność hasła','blokada konta'],
 sec:[
  ['1. Otwórz zasady domeny',[
   R`{Menedżer serwera} > {Narzędzia} > {Zarządzanie zasadami grupy}`,
   R`Po lewej rozwiń: {Las: szkola.local} > {Domeny} > {szkola.local}`,
   R`Prawy klik na {Default Domain Policy} > {Edytuj…}`,
   R`Otworzy się {Edytor zarządzania zasadami grupy}`]],
  ['2. Przejdź do ustawień',[
   R`{Konfiguracja komputera} > {Zasady} > {Ustawienia systemu Windows} > {Ustawienia zabezpieczeń} > {Zasady konta}`,
   R`Kliknij {Zasady haseł} (długość, złożoność, wiek) albo {Zasady blokady konta} (próby, czas)`]],
  ['3. Ustaw wartości',[
   R`Po prawej dwuklik na ustawieniu, np. {Minimalna długość hasła}`,

   R`Wpisz liczbę z arkusza, np. «8» > {OK}`,

   ['minimum X znaków',R`{Minimalna długość hasła}`],
   ['wyłącz złożoność',R`{Hasło musi spełniać wymagania co do złożoności} = Wyłączone`],
   ['zmiana hasła co X dni',R`{Maksymalny okres ważności hasła}`],
   ['nie powtarzaj X haseł',R`{Wymuszaj tworzenie historii haseł}`],
   ['blokada po X próbach',R`{Próg blokady konta}`],
   ['blokada na X minut',R`{Czas trwania blokady konta}`]]},
 tip:R`Tylko {Default Domain Policy}. W GPO podpiętym pod OU to nie zadziała.`,
 check:[R`Terminal: «gpupdate /force»`,R`Za krótkie hasło nowego konta daje błąd`],
 pam:'Hasła i blokady TYLKO w Default Domain Policy > Konfiguracja KOMPUTERA > Zasady konta.',
 errs:[['Ustawione w nowym GPO na OU','Dla kont domeny to nie działa. Ustaw w Default Domain Policy.'],
  ['Pomylony minimalny i maksymalny okres','Maksymalny = co ile dni zmiana. Minimalny = ile dni trzeba czekać.'],
  ['Nie da się ustawić czasu blokady','Najpierw Próg blokady konta (np. 3), potem czas trwania.'],

{id:'ws-gpo', os:'ws', t:'Zasady grupy (GPO)',
 cel:'Blokady dla uczniów: Panel sterowania, tapeta, dysk sieciowy.',
 exam:['nowe GPO','połącz z OU','blokada Panelu','tapeta','mapowanie dysku'],
 sec:[
  ['1. Utwórz GPO',[
   R`{Narzędzia} > {Zarządzanie zasadami grupy}`,
   R`Rozwiń {Las: szkola.local} > {Domeny} > {szkola.local}`,
   R`Prawy klik na OU {Uczniowie} > {Utwórz obiekt GPO w tej domenie i połącz go tutaj…}`,
   R`{Nazwa}: z arkusza, np. «Blokady uczniow» > {OK}`,
   R`Rozwiń OU: pod nią jest nowy GPO. Prawy klik na nim > {Edytuj…}`]],
  ['2. Włącz ustawienie użytkownika',[
   R`{Konfiguracja użytkownika} > {Zasady} > {Szablony administracyjne}`,
   R`Wejdź w folder ze ściągi niżej (np. {Panel sterowania})`,
   R`Po prawej dwuklik na ustawieniu (np. {Zabroń dostępu do Panelu sterowania i ustawień komputera})`,
   R`U góry po lewej zaznacz {Włączone} > {Zastosuj} > {OK}`,
   R`Nie możesz znaleźć? Kliknij {Wszystkie ustawienia} (na dole w Szablonach): lista A–Z`]],
  ['3. Tylko dla jednej grupy (filtrowanie)',[
   R`W {Zarządzanie zasadami grupy} kliknij GPO po lewej > po prawej zakładka {Zakres}`,

  ['4. Ustawienia KOMPUTERA (np. komunikat przy logowaniu)',[

   R`W GPO: {Konfiguracja komputera} > {Zasady} > {Ustawienia systemu Windows} > {Ustawienia zabezpieczeń} > {Zasady lokalne} > {Opcje zabezpieczeń}`,
   R`Komunikat: dwuklik {Logowanie interakcyjne: tytuł komunikatu…} oraz {Logowanie interakcyjne: tekst komunikatu…} > wpisz > {OK}`]],
  ['5. Zastosuj na kliencie',[

  ['Kolejność i dziedziczenie',[
   R`Prawy klik na OU > {Zablokuj dziedziczenie}: OU nie bierze GPO z góry`,

   R`Kilka GPO na jednej OU: zakładka {Połączone obiekty zasad grupy}, wyżej na liście = ważniejsze`]]],

   ['blokada wiersza polecenia',R`{System} > {Zapobiegaj dostępowi do wiersza polecenia}`],
   ['blokada rejestru',R`{System} > {Zapobiegaj dostępowi do narzędzi edycji rejestru}`],
   ['blokada Menedżera zadań',R`{System} > {Opcje Ctrl+Alt+Del} > {Usuń Menedżera zadań}`],
   ['tapeta',R`{Pulpit} > {Pulpit} > {Tapeta pulpitu}`],
   ['mapowanie dysku',R`{Preferencje} > {Ustawienia systemu Windows} > {Mapowania dysków}`]]},
 tip:R`Tapeta musi być w folderze udostępnionym, np. «\\SRV01\tapeta\tlo.jpg». Nie «C:\…».`,
 extra:[['p',R`Ponad 60 ustawień GPO z pełnymi ścieżkami: strona {Zasady grupy A–Z} w menu Narzędzia.`],['p',R`Uczeń = {Konfiguracja użytkownika} (wyloguj). Komputer = {Konfiguracja komputera} (restart, komputer musi być w OU).`]],
 check:[R`Na kliencie jako uczeń: «gpupdate /force», wyloguj, zaloguj`,R`Panel sterowania pokazuje komunikat o blokadzie`],
 pam:'L-S-D-OU: Lokalne, Lokacja, Domena, OU (ostatnie wygrywa). Uczeń = Konfiguracja UŻYTKOWNIKA, wyloguj. Komputer = Konfiguracja KOMPUTERA, restart, komputer w OU.',
 errs:[['GPO niepołączone z OU','Prawy klik na OU > Połącz istniejący obiekt GPO… > wybierz GPO.'],
  ['Uczeń nie jest w tej OU','Przenieś konto do OU (prawy klik > Przenieś…).'],
  ['Ustawienie w Konfiguracji komputera','Ustaw w Konfiguracja użytkownika > Zasady > Szablony administracyjne.'],
  ['Na kliencie nic się nie zmienia','«gpupdate /force», wyloguj, zaloguj. «gpresult /r» pokazuje, czy GPO działa.'],
  ['Tapeta się nie pokazuje','Ścieżka \\\\SRV01\\… i prawo Odczyt dla uczniów. Czasem trzeba zalogować się 2 razy.'],
  ['Połączenie GPO wyłączone (szara ikona)','Prawy klik na połączeniu > zaznacz Połączenie włączone.']],
 cmds:[['ps',R`New-GPO -Name "Uczniowie" | New-GPLink -Target "OU=Uczniowie,DC=szkola,DC=local"`]]},

{id:'ws-dhcp', os:'ws', t:'DHCP',
 fields:[['Kreator nowego zakresu — Nazwa zakresu',[['Nazwa','Pracownia']]],
  ['Zakres adresów IP',[['Początkowy adres IP','192.168.10.100'],['Końcowy adres IP','192.168.10.200'],['Długość','24'],['Maska podsieci','255.255.255.0 (sama się wpisze)']]],
  ['Dodawanie wykluczeń i opóźnienia',[['Początkowy adres IP','z arkusza'],['Końcowy adres IP','z arkusza']]],
  ['Czas trwania dzierżawy',[['Dni / Godziny / Minuty','z arkusza (domyślnie 8 dni)']]],
  ['Router (brama domyślna)',[['Adres IP','192.168.10.1 > Dodaj']]],
  ['Nazwa domeny i serwery DNS',[['Domena nadrzędna','szkola.local'],['Adres IP','192.168.10.10']]]],
 cel:'Serwer sam rozdaje adresy klientom.',
 exam:['zakres','wykluczenia','brama','DNS','rezerwacja'],
 sec:[
  ['0. Zanim zaczniesz',[
   R`Serwer ma stały IP. W VirtualBox serwer i klient są w tej samej {Sieci wewnętrznej}`]],
  ['1. Zainstaluj rolę',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Role serwera}: zaznacz {Serwer DHCP} > {Dodaj funkcje}`,
   R`{Dalej} > {Dalej} > {Dalej} > {Zainstaluj}`,
   R`⏳ Czekaj > {Zamknij}`,
   R`{flaga} u góry > {Ukończ konfigurację DHCP} > {Dalej} > {Zatwierdź} > {Zamknij}`]],
  ['2. Nowy zakres',[
   R`{Narzędzia} > {DHCP}`,
   R`Rozwiń serwer {srv01.szkola.local}. Prawy klik {IPv4} > {Nowy zakres…} > {Dalej}`,
   R`{Nazwa}: «Pracownia» > {Dalej}`,
   R`{Początkowy adres IP}: «192.168.10.100», {Końcowy adres IP}: «192.168.10.200»`,
   R`{Długość}: «24» (maska wpisze się sama) > {Dalej}`,
   R`{Dodawanie wykluczeń}: od–do z arkusza > {Dodaj} > {Dalej} (nie ma? po prostu {Dalej})`,
   R`{Czas trwania dzierżawy}: dni / godziny / minuty z arkusza > {Dalej}`,
   R`{Tak, chcę teraz skonfigurować te opcje} > {Dalej}`,
   R`{Router (brama domyślna)}: «192.168.10.1» > {Dodaj} > {Dalej}`,
   R`{Nazwa domeny i serwery DNS}: «szkola.local» i «192.168.10.10» (zwykle już są) > {Dalej}`,
   R`{Serwery WINS}: nic > {Dalej}`,
   R`{Tak, chcę teraz aktywować ten zakres} > {Dalej} > {Zakończ}`]],
  ['3. Rezerwacja (stały adres dla jednego komputera)',[
   R`Na kliencie: «ipconfig /all» > przepisz {Adres fizyczny} (MAC)`,
   R`Na serwerze w DHCP: rozwiń zakres > prawy klik {Rezerwacje} > {Nowa rezerwacja…}`,
   R`{Nazwa rezerwacji}, {Adres IP}, {Adres MAC} > {Dodaj} > {Zamknij}`]],
  ['4. Klient bierze adres',[
   R`Klient na {Uzyskaj adres IP automatycznie} (lekcja „Adres IP klienta”)`,
   R`Terminal na kliencie: «ipconfig /renew»`]]],
 tip:R`Czerwona strzałka przy IPv4 = brak autoryzacji. Prawy klik na serwerze > {Autoryzuj}.`,
 check:[R`Klient: «ipconfig /renew», potem «ipconfig /all»`,R`Adres klienta jest z zakresu`],
 pam:'Kreator: Nazwa → Od-Do → Wykluczenia → Dzierżawa → Router → DNS → AKTYWUJ. Na końcu zawsze „Tak, aktywuj”.',
 errs:[['Zakres nieaktywny (czerwona strzałka)','Prawy klik na zakresie > Aktywuj.'],
  ['Serwer nieautoryzowany','Prawy klik na nazwie serwera > Autoryzuj, potem F5.'],
  ['Klient ma 169.254.x.x','Klient nie dostał adresu. Sprawdź: ta sama sieć VirtualBox, zakres aktywny, klient na „Uzyskaj automatycznie”. Potem «ipconfig /renew».'],
  ['Klient dostał adres z VirtualBoxa','Karta klienta ma być w „Sieci wewnętrznej”, nie w NAT.'],
  ['Rezerwacja nie działa','MAC przepisz dokładnie z «ipconfig /all» klienta, potem «ipconfig /release» i «ipconfig /renew».'],
  ['Zła brama lub DNS u klientów','Opcje zakresu > popraw 003 Router i 006 Serwery DNS.']],
 cmds:[['ps',R`Install-WindowsFeature DHCP -IncludeManagementTools
Add-DhcpServerv4Scope -Name "Pracownia" -StartRange 192.168.10.100 -EndRange 192.168.10.200 -SubnetMask 255.255.255.0`]]},

{id:'ws-dns', os:'ws', t:'DNS: strefy i rekordy',
 fields:[['Nazwa strefy wyszukiwania wstecznego',[['Identyfikator sieci','192.168.10']]],
  ['Nowy host',[['Nazwa','www'],['Adres IP','192.168.10.20']]],
  ['Nowy rekord zasobu — Alias (CNAME)',[['Nazwa aliasu','poczta'],['W pełni kwalifikowana nazwa domeny (FQDN) hosta docelowego','www.szkola.local']]]],
 cel:'Nazwy zamiast adresów.',
 exam:['strefa wsteczna','rekord A','PTR','CNAME'],
 sec:[
  ['1. Otwórz DNS',[
   R`{Narzędzia} > {DNS}`,
   R`Po lewej rozwiń {SRV01}`]],
  ['2. Strefa wyszukiwania wstecznego',[
   R`Prawy klik {Strefy wyszukiwania wstecznego} > {Nowa strefa…} > {Dalej}`,
   R`{Strefa podstawowa} (zostaw ptaszek {Przechowuj strefę w usłudze Active Directory}) > {Dalej}`,
   R`{Do wszystkich serwerów DNS działających na kontrolerach domeny w tej domenie} > {Dalej}`,
   R`{Strefa wyszukiwania wstecznego IPv4} > {Dalej}`,
   R`{Identyfikator sieci}: «192.168.10» (3 pierwsze liczby) > {Dalej}`,
   R`{Zezwalaj tylko na zabezpieczone aktualizacje dynamiczne} > {Dalej} > {Zakończ}`]],
  ['3. Rekord A (host)',[
   R`Rozwiń {Strefy wyszukiwania do przodu}. Prawy klik na {szkola.local} > {Nowy host (A lub AAAA)…}`,
   R`{Nazwa}: «www» (pod spodem zobaczysz www.szkola.local)`,
   R`{Adres IP}: «192.168.10.10»`,
   R`Zaznacz {Utwórz skojarzony rekord wskaźnika (PTR)} > {Dodaj hosta} > {OK} > {Gotowe}`]],
  ['4. Alias (CNAME)',[
   R`Prawy klik na {szkola.local} > {Nowy alias (CNAME)…}`,
   R`{Nazwa aliasu}: np. «ftp»`,
   R`{Przeglądaj…} > dwuklik {SRV01} > {Strefy wyszukiwania do przodu} > {szkola.local} > kliknij {www} > {OK}`,
   R`{OK}`]],
  ['5. Nowa strefa do przodu (np. egzamin.local)',[
   R`Prawy klik {Strefy wyszukiwania do przodu} > {Nowa strefa…} > {Dalej}`,
   R`{Strefa podstawowa} > {Dalej} (serwer bez AD: odznaczony ptaszek AD, to normalne)`,
   R`{Nazwa strefy}: «egzamin.local» > {Dalej}`,
   R`Bez AD: {Utwórz nowy plik o tej nazwie} > {Dalej}`,
   R`{Nie zezwalaj na aktualizacje dynamiczne} > {Dalej} > {Zakończ}`,
   R`Potem rekord A «www» w tej strefie (krok 3)`]]],
 tip:R`Najpierw strefa wsteczna, potem rekord A. Inaczej PTR się nie utworzy.`,
 check:[R`«nslookup www.szkola.local»`,R`«nslookup 192.168.10.20» zwraca nazwę`],
 pam:'A = nazwa → IP (Adres). PTR = IP → nazwa (Pytasz o nazwę). CNAME = przezwisko. Najpierw strefa wsteczna!',
 errs:[['Rekord A przed strefą wsteczną','Zrób strefę wsteczną, dwuklik na rekordzie A > zaznacz Aktualizuj skojarzony rekord wskaźnika (PTR) > OK.'],
  ['Zły identyfikator sieci','Usuń strefę i zrób nową. Dla /24 wpisz 3 liczby, np. 192.168.10.'],
  ['nslookup pisze „Unknown”','Brak PTR dla samego serwera DNS. Dodaj go albo zignoruj, jeśli adres jest dobry.'],
  ['nslookup nie znajduje nazwy','Klient ma zły DNS (ma być serwer). Sprawdź «ipconfig /all».']],
 extra:[['table',['Rekord','Co robi'],[['A','nazwa → IP'],['PTR','IP → nazwa'],['CNAME','druga nazwa'],['MX','poczta']]]],
 cmds:[['ps',R`Add-DnsServerPrimaryZone -NetworkId "192.168.10.0/24" -ReplicationScope Forest
Add-DnsServerResourceRecordA -ZoneName "szkola.local" -Name "www" -IPv4Address 192.168.10.20 -CreatePtr`]]},

{id:'ws-udzialy', os:'ws', t:'Udziały i uprawnienia',
 cel:'Folder w sieci i kto co może w nim robić.',
 exam:['udostępnij folder','uprawnienia grupy','bez dziedziczenia','limit miejsca'],
 sec:[
  ['1. Zrób folder',[
   R`{Eksplorator plików} > {Ten komputer} > {Dysk lokalny (C:)}`,
   R`Prawy klik w pustym miejscu > {Nowy} > {Folder} > «Dane» > {Enter}`]],
  ['2. Udostępnij (uprawnienia udziału)',[
   R`Prawy klik na {Dane} > {Właściwości} > zakładka {Udostępnianie}`,
   R`{Udostępnianie zaawansowane…} > zaznacz {Udostępnij ten folder}`,
   R`{Nazwa udziału}: z arkusza («Dane$» z dolarem = udział ukryty)`,
   R`Limit osób? {Ogranicz liczbę równoczesnych użytkowników do}: liczba z arkusza`,
   R`{Uprawnienia}: kliknij {Wszyscy} > {Usuń} (jeśli arkusz daje prawa tylko grupie)`,
   R`{Dodaj…} > grupa, np. «klasa2» > {Sprawdź nazwy} > {OK}`,
   R`Kolumna {Zezwalaj}: {Odczyt} albo {Zmiana} albo {Pełna kontrola} > {OK} > {OK}`]],
  ['3. Uprawnienia NTFS (zakładka Zabezpieczenia)',[
   R`Te same {Właściwości} folderu > zakładka {Zabezpieczenia} > {Edytuj…}`,
   R`{Dodaj…} > grupa > {Sprawdź nazwy} > {OK}`,
   R`Kliknij grupę na liście, zaznacz prawa w kolumnie {Zezwalaj} (np. {Modyfikacja}) > {OK}`,
   R`Pamiętaj: działa SUROWSZE z dwóch (udział albo NTFS)`]],
  ['4. Wyłącz dziedziczenie',[
   R`{Zabezpieczenia} > {Zaawansowane} > {Wyłącz dziedziczenie}`,
   R`{Konwertuj odziedziczone uprawnienia na jawne uprawnienia tego obiektu}`,
   R`Kliknij zbędną grupę (np. {Użytkownicy}) > {Usuń} > {Zastosuj} > {OK}`]],
  ['5. Limit miejsca (przydział)',[
   R`{Ten komputer} > prawy klik na dysku > {Właściwości} > {Przydział} > {Pokaż ustawienia przydziałów}`,
   R`Zaznacz {Włącz zarządzanie przydziałami} i {Odmów miejsca na dysku użytkownikom przekraczającym limit przydziału}`,
   R`{Ogranicz miejsce na dysku do}: np. «500 MB», {Ustaw poziom ostrzeżeń na}: np. «450 MB»`,
   R`{OK} > {OK} (włączenie przydziałów)`]]],
 tip:R`Ustaw prawa w obu miejscach: {Udostępnianie} i {Zabezpieczenia}. Działa to, co bardziej ogranicza.`,
 check:[R`Na kliencie {Win}+{R} > «\\SRV01\Dane»`,R`Jako uczeń spróbuj zapisać plik`],
 pam:'Dwa zamki w drzwiach: UDZIAŁ (sieć) i NTFS (dysk). Wejdziesz tylko z kluczem do OBU. Wygrywa to, co bardziej zabrania.',
 errs:[['Prawa tylko w jednym miejscu','Ustaw w obu: Udostępnianie zaawansowane > Uprawnienia ORAZ Zabezpieczenia > Edytuj.'],
  ['Zaznaczone „Odmów”','Odmów wygrywa ze wszystkim. Odznacz Odmów, zaznacz tylko właściwe Zezwalaj.'],
  ['Została grupa Wszyscy / Użytkownicy','Usuń ją z udziału i z NTFS (po wyłączeniu dziedziczenia).'],
  ['Nie da się usunąć grupy (szare pola)','To dziedziczenie. Zaawansowane > Wyłącz dziedziczenie > Konwertuj…'],
  ['Uczeń ma stare prawa','Niech się wyloguje i zaloguje.'],
  ['Limit nie działa na adminie','Limity nie dotyczą administratorów. Testuj kontem ucznia.']],
 extra:[['p',R`Ukryty udział: dodaj {$} na końcu nazwy, np. «Dane$».`],['p',R`Limit na folder i blokada np. mp3: rola {Menedżer zasobów serwera plików} > {Zarządzanie przydziałami} / {Zarządzanie osłonami plików}.`]],
 cmds:[['ps',R`New-SmbShare -Name "Dane" -Path "C:\Dane" -ChangeAccess "SZKOLA\Klasa2TI"`]]},

{id:'ws-profile', os:'ws', t:'Profile mobilne i dysk domowy',
 fields:[['Właściwości użytkownika — zakładka Profil',[['Ścieżka profilu','\\\\SRV01\\Profile\\%username%'],['Folder macierzysty: Połącz','H:'],['Do','\\\\SRV01\\Domowe\\%username%']]]],

   R`Kolumna {Zezwalaj}: {Pełna kontrola} > {OK} > {OK} > {Zamknij}`,

   R`{Ścieżka profilu}: «\\SRV01\Profile\%username%»`,
   R`{Folder macierzysty}: zaznacz {Połącz}, litera «H:», {Do}: «\\SRV01\Domowe\%username%»`,
   R`{Zastosuj}: %username% sam zamieni się na login > {OK}`,

  ['3. Sprawdź na kliencie',[

  ['4. Profil obowiązkowy (tylko jeśli arkusz każe)',[

   R`Wejdź w «C:\Profile\jkowalski.V6» (pyta o dostęp > {Kontynuuj})`,
   R`Prawy klik «NTUSER.DAT» > {Zmień nazwę} > «NTUSER.MAN» > {Enter} > {Tak}`]]],
 tip:R`Kilka kont naraz: zaznacz z {Ctrl} > {Właściwości} > {Profil}.`,
 check:[R`Po wylogowaniu w «C:\Profile» jest folder «login.V6»`,R`Na kliencie widać dysk H:`],
 pam:'%username% = Windows sam wstawi login. Obowiązkowy: .DAT → .MAN (MAN = Mandatory, czyli obowiązkowy).',
 errs:[['Złe ukośniki','Zawsze \\\\SRV01\\Folder\\%username%, same ukośniki wsteczne.'],
  ['„Zalogowano profilem tymczasowym”','Brak praw do udziału Profile: Użytkownicy domeny = Pełna kontrola w udziale i NTFS.'],
  ['Folderu profilu nie ma na serwerze','Profil zapisuje się przy WYLOGOWANIU. Wyloguj się na kliencie.'],
  ['Nie widać NTUSER.DAT','Eksplorator > Widok > Pokaż > Ukryte elementy i Rozszerzenia nazw plików.'],
  ['Brak dostępu do folderu profilu','Kliknij Kontynuuj albo przejmij prawa: Zabezpieczenia > Zaawansowane > Zmień właściciela.'],
  ['Brak dysku H:','Sprawdź zakładkę Profil (Połącz H: Do …), wyloguj i zaloguj.']],
 cmds:[['ps',R`Set-ADUser jkowalski -ProfilePath "\\SRV01\Profile\jkowalski" -HomeDrive "H:" -HomeDirectory "\\SRV01\Domowe\jkowalski"`]]},

{id:'ws-iis', os:'ws', t:'Strona WWW i FTP',
 fields:[['Dodaj witrynę sieci Web',[['Nazwa witryny','Szkola'],['Ścieżka fizyczna','C:\\www'],['Port','8080']]],
  ['Dodaj witrynę FTP',[['Nazwa witryny FTP','FTP'],['Ścieżka fizyczna','C:\\ftp']]]],
 cel:'Własna strona i serwer plików FTP.',
 exam:['IIS','witryna i port','FTP dla użytkownika'],
 sec:[
  ['1. Zainstaluj',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Role serwera}: zaznacz {Serwer sieci Web (IIS)} > {Dodaj funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Usługi ról}: przewiń na dół, zaznacz {Serwer FTP} (w środku {Usługa FTP}) > {Dalej} > {Zainstaluj}`,
   R`⏳ Czekaj > {Zamknij}`]],
  ['2. Przygotuj stronę',[
   R`{C:} > nowy folder «www»`,
   R`{Start} > «Notatnik» > wpisz treść strony z arkusza`,
   R`{Plik} > {Zapisz jako} > «C:\www», nazwa «index.html», typ {Wszystkie pliki (*.*)} > {Zapisz}`]],
  ['3. Witryna WWW',[
   R`{Narzędzia} > {Menedżer internetowych usług informacyjnych (IIS)}`,
   R`Po lewej rozwiń {SRV01}. Prawy klik {Witryny} > {Dodaj witrynę sieci Web…}`,
   R`{Nazwa witryny}: z arkusza, {Ścieżka fizyczna}: «C:\www»`,
   R`{Port}: z arkusza (np. «8080») > {OK}`,
   R`Arkusz chce port 80? Najpierw prawy klik {Default Web Site} > {Zarządzaj witryną sieci Web} > {Zatrzymaj}`]],
  ['4. Witryna FTP',[
   R`{C:} > nowy folder «ftp»`,
   R`Prawy klik {Witryny} > {Dodaj witrynę FTP…}`,
   R`{Nazwa witryny FTP}, {Ścieżka fizyczna}: «C:\ftp» > {Dalej}`,
   R`{Adres IP}: {Wszystkie nieprzypisane}, port «21», {Bez protokołu SSL} > {Dalej}`,
   R`{Uwierzytelnianie}: {Podstawowe}`,
   R`{Zezwalaj na dostęp}: {Określeni użytkownicy} > wpisz login`,
   R`{Uprawnienia}: {Odczyt} i/lub {Zapis} > {Zakończ}`,
   R`Ta osoba musi mieć też prawa NTFS do «C:\ftp» (lekcja Udziały, krok 3)`]],
  ['5. Powiązanie z kartą i dokument domyślny (jeśli arkusz)',[
   R`Kliknij witrynę po lewej > po prawej {Powiązania…} > zaznacz > {Edytuj…}`,
   R`{Typ}: {http}, {Adres IP}: wybierz adres karty z arkusza (np. LAN_WWW), {Port}: «80» > {OK} > {Zamknij}`,
   R`Kliknij witrynę > na środku dwuklik {Dokument domyślny}`,
   R`Po prawej {Dodaj…} > «egzamin.html» > {OK} (przesuń na górę {W górę})`,
   R`Test na stacji: przeglądarka «http://www.egzamin.local»`]]],
 tip:R`Własny port (np. 8080)? Otwórz go w zaporze (lekcja Zapora).`,
 check:[R`Przeglądarka na kliencie: «http://192.168.10.10:8080»`,R`Eksplorator: «ftp://192.168.10.10»`],
 pam:'Strona działa, gdy: jest index.html ✓ witryna wskazuje folder ✓ port otwarty w zaporze ✓.',
 errs:[['Plik zapisany jako index.html.txt','Włącz Rozszerzenia nazw plików i zmień nazwę.'],
  ['Port zablokowany w zaporze','wf.msc > Nowa reguła > Port > TCP > numer > Zezwalaj.'],
  ['Port 80 zajęty przez Default Web Site','Daj inny port albo zatrzymaj Default Web Site.'],
  ['Błąd 401 / 403','Zabezpieczenia folderu: dodaj IIS_IUSRS z Odczytem.'],
  ['FTP nie wpuszcza','Uwierzytelnianie Podstawowe + reguła dla użytkownika. Port 21 w zaporze.']],
 cmds:[['ps',R`Install-WindowsFeature Web-Server, Web-Ftp-Server -IncludeManagementTools`]]},

{id:'ws-routing', os:'ws', t:'Routing i NAT',
 cel:'Serwer z dwiema kartami daje Internet klientom.',
 exam:['druga karta','NAT','serwer jako brama'],
 sec:[
  ['0. Zanim zaczniesz',[
   R`Serwer ma 2 karty: VirtualBox {Karta 1} = {Sieć wewnętrzna}, {Karta 2} = {NAT}`]],
  ['1. Nazwij karty',[
   R`{Win}+{R} > «ncpa.cpl» > {Enter}`,
   R`Prawy klik na karcie od sieci wewnętrznej > {Zmień nazwę} > «LAN»`,
   R`Prawy klik na drugiej karcie > {Zmień nazwę} > «WAN»`,
   R`LAN ma stały IP (np. «192.168.10.10»), WAN zostaw automatycznie`]],
  ['2. Zainstaluj rolę',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Role serwera}: zaznacz {Dostęp zdalny} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Usługi ról}: zaznacz {Routing} > {Dodaj funkcje} > {Dalej} > {Dalej} > {Dalej} > {Zainstaluj} > {Zamknij}`]],
  ['3. Włącz NAT',[
   R`{Narzędzia} > {Routing i dostęp zdalny}`,
   R`Prawy klik na {SRV01 (lokalnie)} > {Konfiguruj i włącz routing i dostęp zdalny} > {Dalej}`,
   R`{Translator adresów sieciowych (NAT)} > {Dalej}`,
   R`{Użyj tego interfejsu publicznego do łączenia się z Internetem}: kliknij «WAN» > {Dalej}`,
   R`Kolejne pytania: {Dalej}`,
   R`{Zakończ} > {Uruchom usługę}`]],
  ['4. Klienci',[
   R`Na kliencie {Brama domyślna} = adres LAN serwera «192.168.10.10»`,
   R`Test: «ping» bramy po stronie WAN (adres z arkusza). Internetu na egzaminie nie ma, więc nie pinguj 8.8.8.8`]]],
 tip:R`Jako publiczną wybierz kartę WAN, nie LAN.`,
 check:[R`Klient: «ping» adresu WAN serwera albo bramy WAN odpowiada`],
 pam:'WAN = Internet (publiczna). LAN = klienci. Brama klienta = IP serwera od strony LAN.',
 errs:[['Pomylone karty','RRAS > prawy klik na serwerze > Wyłącz routing, potem skonfiguruj od nowa z kartą WAN.'],
  ['Stara brama u klientów','Brama klienta = IP karty LAN serwera (albo opcja 003 w DHCP).'],
  ['Ping 8.8.8.8 działa, strony nie','DNS: właściwości serwera DNS > Usługi przesyłania dalej > dodaj np. 8.8.8.8.']],
 cmds:[['ps',R`Install-WindowsFeature Routing -IncludeManagementTools`]]},

{id:'ws-druk', os:'ws', t:'Serwer wydruku',
 cel:'Jedna drukarka dla całej sali.',
 exam:['udostępnij drukarkę','prawa grupy','godziny'],
 sec:[
  ['1. Zainstaluj rolę',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`Zaznacz {Usługi drukowania i zarządzania dokumentami} > {Dodaj funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Usługi ról}: zostaw {Serwer wydruku} > {Dalej} > {Zainstaluj} > {Zamknij}`]],
  ['2. Dodaj drukarkę',[
   R`{Narzędzia} > {Zarządzanie drukowaniem}`,
   R`Rozwiń {Serwery wydruku} > {SRV01 (lokalny)}. Prawy klik {Drukarki} > {Dodaj drukarkę…}`,
   R`{Dodaj drukarkę TCP/IP lub usług sieci Web przez wprowadzenie adresu IP lub nazwy hosta} > {Dalej}`,
   R`{Typ urządzenia}: {Urządzenie TCP/IP}, {Nazwa hosta lub adres IP}: z arkusza`,
   R`Odznacz {Badaj drukarkę i automatycznie wybierz sterownik} > {Dalej}`,
   R`Szuka i nie znajduje? {Standardowe} > {Generic Network Card} > {Dalej}`,
   R`{Zainstaluj nowy sterownik} > {Dalej} > {Z dysku…} > {Przeglądaj…} > pendrive DOKUMENTACJA/PROGRAMY > folder DRUKARKA > plik .inf > {OK} > {Dalej}`,
   R`Na pendrive nie ma sterownika? Producent {Microsoft} > np. {Microsoft MS-XPS Class Driver 2} > {Dalej}`,
   R`{Nazwa drukarki} z arkusza, zaznacz {Udostępnij tę drukarkę}, {Nazwa udziału} z arkusza > {Dalej} > {Dalej} > {Zakończ}`]],
  ['3. Uprawnienia i godziny',[
   R`Po lewej {Drukarki}. Prawy klik na drukarce > {Właściwości}`,
   R`Zakładka {Zabezpieczenia}: kliknij {Wszyscy} > {Usuń} (jeśli arkusz każe)`,
   R`{Dodaj…} > grupa > {Sprawdź nazwy} > {OK} > zaznacz {Drukuj}`,
   R`Zakładka {Zaawansowane}: {Dostępna od} «08:00» {do} «16:00»`,
   R`{Priorytet}: liczba z arkusza (1–99) > {OK}`]],
  ['4. Uprawnienia jak w arkuszu',[
   R`{Zabezpieczenia}: {Wszyscy} > {Usuń}`,
   R`Grupa/konto z arkusza: tylko {Drukuj}`,
   R`{TWÓRCA-WŁAŚCICIEL}: {Zarządzaj dokumentami}`,
   R`{Administratorzy}: wszystkie {Zezwalaj} > {OK}`,
   R`Najwyższy priorytet = «99». Zakładka {Ogólne} > {Drukuj stronę testową}`]],
  ['5. Drukarka dla OU przez GPO (jeśli arkusz)',[
   R`Najpierw GPO na OU (lekcja GPO, krok 1)`,
   R`{Zarządzanie drukowaniem} > {Drukarki} > prawy klik na drukarce > {Wdróż z zasadami grupy…}`,
   R`{Przeglądaj…} > wybierz GPO z OU (np. Uczniowie) > {OK}`,
   R`Zaznacz {Użytkownicy, do których jest stosowany ten obiekt GPO (na użytkownika)} > {Dodaj} > {OK} > {OK}`,
   R`⟳ Na stacji «gpupdate /force», wyloguj i zaloguj`]]],
 tip:R`Bez prawdziwej drukarki: {Utwórz nowy port} > {Local Port} > «FILE:».`,
 check:[R`Klient: {Win}+{R} > «\\SRV01» > dwuklik na drukarce`],
 pam:'Drukarka = Zarządzanie drukowaniem. Bez drukarki: port FILE:',
 errs:[['Inna nazwa udziału niż w arkuszu','Właściwości > Udostępnianie > popraw nazwę.'],
  ['Klient nie instaluje sterownika','Użyj wbudowanego sterownika (np. Microsoft PCL6) albo dodaj sterownik w Udostępnianie > Dodatkowe sterowniki.'],
  ['Grupa drukuje mimo zakazu','Usuń grupę Wszyscy z Zabezpieczeń drukarki.']],
 cmds:[]},

{id:'ws-kopie', os:'ws', t:'Kopia zapasowa',
 cel:'Kopia folderu na drugi dysk.',
 exam:['kopia raz','kopia o godzinie'],
 sec:[
  ['1. Zainstaluj funkcję',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Role serwera}: nic nie zaznaczaj > {Dalej}`,
   R`{Funkcje}: zaznacz {Kopia zapasowa systemu Windows Server} > {Dalej} > {Zainstaluj} > {Zamknij}`]],
  ['2. Kopia jednorazowa',[
   R`{Narzędzia} > {Kopia zapasowa systemu Windows Server}`,
   R`Po lewej {Kopia zapasowa lokalna}. Po prawej {Kopia zapasowa — raz…}`,
   R`{Inne opcje} > {Dalej}`,
   R`{Niestandardowa} > {Dalej} > {Dodaj elementy} > zaznacz folder z arkusza > {OK} > {Dalej}`,
   R`{Dyski lokalne} > {Dalej} > wybierz dysk docelowy > {Dalej} > {Kopia zapasowa}`,
   R`⏳ Czekaj > {Zamknij}`]],
  ['Albo harmonogram (codziennie o godzinie)',[
   R`Po prawej {Harmonogram kopii zapasowych…} > {Dalej}`,
   R`{Niestandardowa} > {Dalej} > {Dodaj elementy} > folder > {OK} > {Dalej}`,
   R`{Raz dziennie} > godzina z arkusza > {Dalej}`,
   R`{Utwórz kopię zapasową na dysku twardym przeznaczonym na kopie zapasowe} > {Dalej}`,
   R`{Pokaż wszystkie dostępne dyski…} > zaznacz pusty dysk > {OK} > zaznacz go > {Dalej} > {Tak} (sformatuje go!) > {Zakończ}`]]],
 check:[R`Na dysku docelowym jest folder «WindowsImageBackup»`],
 pam:'Kopia NIGDY na ten sam dysk. Kopia zapasowa to FUNKCJA, nie rola.',
 errs:[['Kopia na ten sam dysk','Dodaj drugi dysk w VirtualBox i zainicjuj go w diskmgmt.msc.'],
  ['Brak narzędzia w menu','Dodaj role i funkcje > strona Funkcje > Kopia zapasowa systemu Windows Server.'],
  ['Harmonogram chce sformatować dysk','Harmonogram zabiera cały dysk. Daj pusty dysk albo folder sieciowy.']],
 cmds:[['cmd',R`wbadmin start backup -backupTarget:E: -include:C:\Dane -quiet`]]},

{id:'ws-kopiowanie', os:'ws', t:'Konto z szablonu (kopiuj)',
 cel:'Arkusz: „utwórz konto na podstawie szablonu”. Nowe konto bierze grupy, profil i godziny.',
 exam:['szablon konta','kopiuj','konto wyłączone'],
 sec:[
  ['1. Zrób szablon',[
   R`{Narzędzia} > {Użytkownicy i komputery usługi Active Directory}`,
   R`Prawy klik na OU {Uczniowie} > {Nowy} > {Użytkownik}`,
   R`{Imię}: «_szablon», {Nazwa logowania użytkownika}: «_szablon» > {Dalej}`,
   R`Hasło 2×, zaznacz {Konto jest wyłączone} (na szablon nikt się nie loguje) > {Dalej} > {Zakończ}`,
   R`Dwuklik na {_szablon} > zakładka {Członek grupy} > {Dodaj…} > grupa > {Sprawdź nazwy} > {OK}`,
   R`Zakładka {Profil}: «\\SRV01\Profile\%username%» i dysk domowy (jeśli arkusz)`,
   R`Zakładka {Konto}: {Godziny logowania…} i {Wygasanie konta} (jeśli arkusz) > {OK}`]],
  ['2. Kopiuj',[
   R`Prawy klik na {_szablon} > {Kopiuj…}`,
   R`{Imię}, {Nazwisko}, {Nazwa logowania użytkownika} nowej osoby > {Dalej}`,
   R`Hasło 2×, ODZNACZ {Konto jest wyłączone} > {Dalej} > {Zakończ}`,
   R`Sprawdź: dwuklik na nowym koncie > {Członek grupy}: grupy są skopiowane`]]],
 tip:R`Kopiuje się: grupy, profil, folder macierzysty, godziny, wygaśnięcie. NIE kopiuje się: opis, e-mail, telefon.`,
 check:[R`Nowe konto ma te same grupy co szablon`],
 pam:'Szablon = wyłączone konto-wzór. Prawy klik > Kopiuj.',
 errs:[['Nowe konto jest wyłączone','Przy kopiowaniu odznacz „Konto jest wyłączone” albo prawy klik na koncie > Włącz konto.'],
  ['Profil ma ścieżkę z nazwą szablonu','W szablonie wpisz %username%, nie login. Wtedy podmieni się sam.']],
 cmds:[]},

{id:'ws-skrypt', os:'ws', t:'Skrypt logowania',
 cel:'Plik .bat uruchamia się przy logowaniu, np. mapuje dysk.',
 exam:['skrypt logowania','NETLOGON','net use'],
 sec:[
  ['1. Napisz skrypt',[
   R`{Start} > wpisz «Notatnik» > {Enter}`,
   R`Wpisz np. «net use Z: \\SRV01\Dane /persistent:no»`,
   R`{Plik} > {Zapisz jako} > na dole typ {Wszystkie pliki (*.*)}`,
   R`W pasku adresu u góry wpisz «\\localhost\NETLOGON» > {Enter}`,
   R`{Nazwa pliku}: «logon.bat» > {Zapisz}`]],
  ['2a. Podepnij w koncie (jedna osoba)',[
   R`ADUC > dwuklik na użytkowniku > zakładka {Profil}`,
   R`{Skrypt logowania}: «logon.bat» (sama nazwa, bez ścieżki) > {OK}`]],
  ['2b. Albo w GPO (cała OU)',[
   R`{Zarządzanie zasadami grupy} > prawy klik GPO na OU > {Edytuj…}`,
   R`{Konfiguracja użytkownika} > {Zasady} > {Ustawienia systemu Windows} > {Skrypty (logowanie/wylogowanie)}`,
   R`Dwuklik {Logowanie} > {Pokaż pliki…} > wklej tam «logon.bat» > zamknij okienko`,
   R`{Dodaj…} > {Przeglądaj…} > kliknij «logon.bat» > {Otwórz} > {OK} > {OK}`]],
  ['3. Sprawdź na kliencie',[
   R`⟳ Wyloguj i zaloguj kontem z domeny`,
   R`{Ten komputer}: jest dysk Z:`]]],
 tip:R`NETLOGON to folder «C:\Windows\SYSVOL\sysvol\szkola.local\scripts». W koncie wpisujesz samą nazwę pliku.`,
 check:[R`Po zalogowaniu na kliencie widać dysk Z:`],
 pam:'Skrypt do NETLOGON, w koncie tylko nazwa: logon.bat.',
 errs:[['Plik zapisał się jako logon.bat.txt','Przy zapisie wybierz typ „Wszystkie pliki”. Włącz rozszerzenia: Widok > Pokaż > Rozszerzenia nazw plików.'],
  ['Skrypt nie działa','Uruchom go ręcznie na kliencie: \\\\SRV01\\NETLOGON\\logon.bat. Czy udział Dane istnieje i są do niego prawa?']],
 cmds:[['cmd',R`net use Z: \\SRV01\Dane /persistent:no`]]},

{id:'ws-mapgpo', os:'ws', t:'Dysk i drukarka przez GPO',
 cel:'Każdy z OU dostaje dysk Z: i drukarkę bez skryptu.',
 exam:['mapowanie dysku GPO','preferencje','drukarka GPO'],
 sec:[
  ['1. Otwórz GPO',[
   R`{Narzędzia} > {Zarządzanie zasadami grupy}`,
   R`Prawy klik na OU {Uczniowie} > {Utwórz obiekt GPO w tej domenie i połącz go tutaj…} > nazwa > {OK}`,
   R`Prawy klik na nowym GPO > {Edytuj…}`]],
  ['2. Mapuj dysk',[
   R`{Konfiguracja użytkownika} > {Preferencje} > {Ustawienia systemu Windows} > {Mapowania dysków}`,
   R`Prawy klik {Mapowania dysków} > {Nowy} > {Zamapowany dysk}`,
   R`{Akcja}: {Aktualizuj}`,
   R`{Lokalizacja}: «\\SRV01\Dane»`,
   R`Zaznacz {Połącz ponownie}, {Etykieta jako}: np. «Dane»`,
   R`{Użyj}: litera «Z» > {OK}`]],
  ['3. Drukarka',[
   R`{Konfiguracja użytkownika} > {Preferencje} > {Ustawienia panelu sterowania} > {Drukarki}`,
   R`Prawy klik {Drukarki} > {Nowy} > {Drukarka udostępniona}`,
   R`{Akcja}: {Aktualizuj}, {Ścieżka udziału}: «\\SRV01\Drukarka»`,
   R`Ma być domyślna? Zaznacz {Ustaw tę drukarkę jako domyślną} > {OK}`]],
  ['4. Zastosuj na kliencie',[
   R`Klient: Terminal > «gpupdate /force»`,
   R`⟳ Wyloguj i zaloguj`]]],
 tip:R`To są {Preferencje}, nie {Zasady}. Szukaj w drugiej gałęzi pod Konfiguracją użytkownika.`,
 check:[R`Klient: w {Ten komputer} jest Z:, w drukarkach jest drukarka`],
 pam:'Preferencje > Mapowania dysków. Akcja: Aktualizuj.',
 errs:[['Dysk się nie pojawia','Czy GPO jest podpięte do OU, w której jest UŻYTKOWNIK? Czy udział istnieje i są prawa?'],
  ['Drukarka się nie dodaje','Na serwerze drukarka musi być udostępniona (lekcja Serwer wydruku).']],
 cmds:[]},

{id:'ws-fsrm', os:'ws', t:'Limit na folder i blokada plików (FSRM)',
 cel:'Limit miejsca na FOLDER (nie cały dysk) albo zakaz zapisu np. plików .mp3.',
 exam:['przydział na folder','osłona plików','FSRM'],
 sec:[
  ['1. Zainstaluj',[
   R`{Zarządzaj} > {Dodaj role i funkcje} > {Dalej} > {Dalej} > {Dalej}`,
   R`{Role serwera}: rozwiń {Usługi plików i magazynowania} > rozwiń {Usługi plików i iSCSI}`,
   R`Zaznacz {Menedżer zasobów serwera plików} > {Dodaj funkcje} > {Dalej} > {Dalej} > {Zainstaluj} > {Zamknij}`]],
  ['2. Limit na folder (przydział)',[
   R`{Narzędzia} > {Menedżer zasobów serwera plików}`,
   R`Rozwiń {Zarządzanie przydziałami} > prawy klik {Przydziały} > {Utwórz przydział…}`,
   R`{Ścieżka przydziału}: {Przeglądaj…} > folder, np. «C:\Dane» > {OK}`,
   R`{Zdefiniuj właściwości przydziału niestandardowego} > {Właściwości niestandardowe…}`,
   R`{Limit}: np. «100» {MB}, zaznacz {Przydział stały} > {OK}`,
   R`{Utwórz} > {Zapisz przydział niestandardowy bez tworzenia szablonu} > {OK}`]],
  ['3. Blokada typów plików (osłona)',[
   R`Rozwiń {Zarządzanie osłanianiem plików} > prawy klik {Osłony plików} > {Utwórz osłonę pliku…}`,
   R`{Ścieżka osłony plików}: {Przeglądaj…} > folder > {OK}`,
   R`{Zdefiniuj właściwości osłony pliku niestandardowego} > {Właściwości niestandardowe…}`,
   R`{Osłanianie aktywne}, zaznacz grupę, np. {Pliki audio i wideo} > {OK}`,
   R`{Utwórz} > {Zapisz osłonę pliku niestandardowego bez tworzenia szablonu} > {OK}`]]],
 tip:R`Limit na cały DYSK = Właściwości dysku > Przydział (lekcja Udziały). Limit na FOLDER = FSRM.`,
 check:[R`Kopiujesz za duży plik do folderu: wyskakuje błąd o braku miejsca`],
 pam:'Stały = twardy limit. Miękki = tylko ostrzega. Osłona = zakaz typów plików.',
 errs:[['Limit nie działa','Wybrany „Przydział miękki”. Zmień na „Przydział stały”.'],

{id:'ws-raid', os:'ws', t:'RAID: dublowanie dysków',

 exam:['RAID 1','wolumin dublowany','dysk dynamiczny'],
 sec:[

   R`Okno {Inicjowanie dysku}: zaznaczone oba > {GPT} > {OK}`]],

   R`Lista {Dostępne}: kliknij drugi dysk > {Dodaj} > {Dalej}`,
   R`Litera, np. «F» > {Dalej}`,
   R`{NTFS}, etykieta «RAID1», {Wykonaj szybkie formatowanie} > {Dalej} > {Zakończ}`,
   R`Pyta o konwersję na dyski dynamiczne > {Tak}`,
   R`⏳ Czekaj, aż {Ponowne synchronizowanie} dojdzie do 100%`]]],

 cmds:[]},

{id:'ws-teaming', os:'ws', t:'Nazwy kart i NIC Teaming',
 cel:'Arkusz: „nazwa połączenia LAN1”, „wyłącz drugi interfejs”, „zespół kart LAN12”.',
 exam:['nazwa połączenia','wyłącz interfejs','NIC Teaming'],
 sec:[
  ['1. Zmień nazwę połączenia',[
   R`{Win}+{R} > «ncpa.cpl» > {Enter}`,
   R`Która karta jest w którym porcie? Wyjmij na chwilę kabel: karta z czerwonym X to ta`,
   R`Prawy klik na karcie > {Zmień nazwę} > np. «LAN1» > {Enter}`]],
  ['2. Wyłącz drugą kartę (jeśli arkusz)',[
   R`Prawy klik na nieużywanej karcie > {Wyłącz}`]],
  ['3. Zespół kart (NIC Teaming)',[
   R`{Menedżer serwera} > {Serwer lokalny} > obok {Tworzenie zespołu kart interfejsu sieciowego} kliknij {Wyłączone}`,
   R`Ramka {ZESPOŁY} > {ZADANIA} > {Nowy zespół}`,
   R`{Nazwa zespołu}: «LAN12», zaznacz karty «LAN1» i «LAN2»`,
   R`Rozwiń {Właściwości dodatkowe}`,
   R`{Tryb tworzenia zespołu}: {Niezależny od przełącznika}`,
   R`{Tryb równoważenia obciążenia}: {Dynamiczny}`,
   R`{Karta rezerwowa}: {Brak (wszystkie karty są aktywne)} > {OK}`,
   R`⏳ Czekaj, aż zespół będzie {Online}`]],
  ['4. Adres IP zespołu',[
   R`«ncpa.cpl»: jest nowa karta «LAN12»`,
   R`Prawy klik > {Właściwości} > {Protokół internetowy w wersji 4 (TCP/IPv4)} > {Właściwości}`,
   R`Adres, maska, brama z arkusza, {Preferowany serwer DNS}: «127.0.0.1» (localhost) > {OK}`]]],
 tip:R`Adres IP wpisujesz na karcie zespołu (LAN12), nie na LAN1 i LAN2.`,
 check:[R`«ipconfig»: adres jest na karcie LAN12`],
 pam:'Zespół: Niezależny od przełącznika + Dynamiczny + wszystkie aktywne.',
 errs:[['Nie wiem, która karta to który port','Wyjmij kabel z portu przełącznika. Karta, która dostanie czerwony X, jest w tym porcie.']],
 cmds:[['ps',R`Rename-NetAdapter -Name "Ethernet" -NewName "LAN1"
New-NetLbfoTeam -Name "LAN12" -TeamMembers "LAN1","LAN2" -TeamingMode SwitchIndependent -LoadBalancingAlgorithm Dynamic`]]},

{id:'ws-rdp', os:'ws', t:'Pulpit zdalny na serwerze',

   R`Okno {Właściwości systemu}, zakładka {Zdalny}`,
   R`Zaznacz {Zezwalaj na połączenia zdalne z tym komputerem} > {OK} (komunikat o zaporze)`,

   R`Zwykły użytkownik ma się łączyć? {Wybierz użytkowników…} > {Dodaj…} > login > {OK}`,

{id:'ws-petla', os:'ws', t:'Skrypt: wiele kont w pętli',
 cel:'Arkusz: „skrypt tworzący konta student_1 do student_5, dowolna pętla”.',
 exam:['skrypt','pętla','net user'],
 sec:[
  ['1. PowerShell ISE',[
   R`{Start} > wpisz «PowerShell ISE» > prawy klik > {Uruchom jako administrator}`,
   R`{Plik} > {Nowy}`,
   R`Wpisz skrypt z ramki {Do pliku} niżej`,
   R`{Plik} > {Zapisz jako} > «C:\konta.ps1» > {Zapisz}`,
   R`Uruchom: zielona strzałka albo {F5}`]],
  ['2. Sprawdź',[
   R`W dolnym oknie wpisz «net user» > {Enter}`,
   R`Na liście są student_1 … student_5 (na kontrolerze domeny: też w ADUC > {Users})`]],
  ['Albo plik .bat',[
   R`Notatnik: «for /L %%i in (1,1,5) do net user student_%%i /add»`,
   R`Zapisz jako «konta.bat» (typ {Wszystkie pliki}) > prawy klik > {Uruchom jako administrator}`]]],
 file:R`for ($i = 1; $i -le 5; $i++) {
    net user "student_$i" /add
}`,
 tip:R`Na egzaminie wystarczy dowolna pętla. Pokaż plik skryptu i wynik «net user».`,
 check:[R`«net user» pokazuje 5 kont`],
 pam:'for ($i=1; $i -le 5; $i++) { net user "student_$i" /add }',
 errs:[['„Uruchamianie skryptów jest wyłączone”','W ISE wpisz: Set-ExecutionPolicy RemoteSigned, potwierdź T, uruchom znowu.'],
  ['„Hasło nie spełnia wymagań” na kontrolerze domeny','Dodaj hasło: net user "student_$i" Zaq12wsx! /add']],
 cmds:[['ps',R`1..5 | ForEach-Object { New-LocalUser -Name "student_$_" -NoPassword }`]]},

{id:'w11-siec', os:'w11', t:'Adres IP klienta',
 fields:[['Właściwości: Protokół internetowy w wersji 4 (TCP/IPv4)',[['Adres IP','192.168.10.50'],['Maska podsieci','255.255.255.0'],['Brama domyślna','192.168.10.1'],['Preferowany serwer DNS','192.168.10.10']]]],

  ['2a. Adres ręczny (arkusz podaje IP)',[

   R`{Adres IP}: «192.168.10.50»`,
   R`{Maska podsieci}: «255.255.255.0»`,
   R`{Brama domyślna}: «192.168.10.1»`,
   R`{Preferowany serwer DNS}: adres SERWERA «192.168.10.10» (nie 8.8.8.8, bo domena nie zadziała)`,

  ['2b. Adres z DHCP (arkusz: automatycznie)',[

{id:'w11-domena', os:'w11', t:'Dołączenie do domeny',
 fields:[['Zmiany nazwy komputera/domeny',[['Nazwa komputera','STACJA01'],['Członek: Domena','szkola.local']]],
  ['Zabezpieczenia systemu Windows',[['Nazwa użytkownika','Administrator'],['Hasło','hasło administratora serwera']]]],
 cel:'Komputer ucznia w domenie serwera.',
 exam:['dołącz do domeny','logowanie kontem domenowym'],
 sec:[
  ['0. Zanim zaczniesz',[
   R`DNS klienta = adres serwera (lekcja wyżej). Test: «ping szkola.local» musi odpowiadać`]],
  ['1. Dołącz',[
   R`{Win}+{R} > «sysdm.cpl» > {Enter}`,
   R`Zakładka {Nazwa komputera} > {Zmień…}`,
   R`Arkusz każe zmienić nazwę? {Nazwa komputera}: «STACJA01» (można razem z domeną)`,
   R`{Członek}: zaznacz {Domena} > wpisz «szkola.local» > {OK}`,
   R`Okno logowania: «Administrator» + hasło administratora SERWERA > {OK}`,
   R`„Witamy w domenie szkola.local” > {OK} > {OK}`,
   R`{Zamknij} > {Uruchom ponownie teraz}`,
   R`⟳ RESTART klienta`]],
  ['2. Zaloguj się kontem domenowym',[
   R`Ekran logowania: na dole po lewej {Inny użytkownik}`,
   R`Login «SZKOLA\jkowalski» (albo «jkowalski@szkola.local»), hasło z serwera`,
   R`Każe zmienić hasło? Wpisz nowe 2× > {Enter}`]]],
 tip:R`Tylko Windows 11 Pro (lub Education/Enterprise). Home nie dołączy.`,
 check:[R`«whoami» pokazuje «szkola\jkowalski»`,R`Na serwerze komputer jest w {Computers}`],
 pam:'sysdm.cpl → Zmień → Domena. Logowanie: DOMENA\\login.',
 errs:[['„Nie można skontaktować się z kontrolerem domeny”','DNS klienta ≠ serwer. Popraw DNS i sprawdź «ping szkola.local».'],
  ['Windows 11 Home','Nie da się. Potrzebny Pro albo Education.'],
  ['Różnica czasu ponad 5 minut','Ustaw ten sam czas i strefę na obu komputerach.'],
  ['„Konto komputera już istnieje”','Na serwerze usuń komputer z Computers albo zmień nazwę klienta.'],
  ['Logujesz się na konto lokalne','Wpisz SZKOLA\\login, z nazwą domeny.']],
 cmds:[['ps',R`Add-Computer -DomainName "szkola.local" -Restart`]]},

{id:'w11-secpol', os:'w11', t:'Zasady lokalne (secpol)',
 cel:'Hasła i blokady tylko na tym komputerze, bez domeny.',
 exam:['lokalne zasady haseł','blokada konta','nazwa konta administratora'],
 sec:[
  ['1. Otwórz',[
   R`{Win}+{R} > «secpol.msc» > {Enter}`]],

   R`Po lewej rozwiń {Zasady konta} > kliknij {Zasady haseł} albo {Zasady blokady konta}`,
   R`Po prawej dwuklik na ustawieniu (np. {Minimalna długość hasła})`,
   R`Wpisz wartość z arkusza > {OK}`,
   R`Blokada: NAJPIERW {Próg blokady konta}, potem pozostałe dwa`]],
  ['3. Inne ustawienia',[
   R`{Zasady lokalne} > {Opcje zabezpieczeń}: np. {Logowanie interakcyjne: nie wyświetlaj nazwy ostatniego użytkownika}`,
   R`{Zasady lokalne} > {Przypisywanie praw użytkownika}: np. {Zamykanie systemu} > {Dodaj użytkownika lub grupę…}`]],
  ['4. Zastosuj',[
   R`Prawy klik {Start} > {Terminal (Administrator)} > «gpupdate /force»`]],
  ['5. Ctrl+Alt+Del i komunikat przy logowaniu',[
   R`{Zasady lokalne} > {Opcje zabezpieczeń}`,
   R`Dwuklik {Logowanie interakcyjne: nie wymagaj naciśnięcia klawiszy CTRL+ALT+DEL} > {Wyłączone} (= WYMAGAJ) > {OK}`,
   R`Dwuklik {Logowanie interakcyjne: tytuł komunikatu dla użytkowników próbujących się zalogować} > wpisz > {OK}`,
   R`Dwuklik {Logowanie interakcyjne: tekst komunikatu dla użytkowników próbujących się zalogować} > wpisz > {OK}`,
   R`⟳ Wyloguj się i sprawdź`]]],
 map:{t:'Arkusz mówi → ustawienie',rows:[
   ['minimum X znaków',R`{Minimalna długość hasła}`],
   ['wyłącz złożoność',R`{Hasło musi spełniać wymagania co do złożoności} = Wyłączone`],
   ['blokada po X próbach',R`{Próg blokady konta}`],
   ['zmień nazwę konta Administrator',R`{Opcje zabezpieczeń} > {Konta: Zmień nazwę konta administratora}`],
   ['wyłącz konto Gość',R`{Opcje zabezpieczeń} > {Konta: Stan konta Gość} = Wyłączone`]]},
 tip:R`Komputer w domenie? Zasady domeny nadpiszą te lokalne.`,
 check:[R`«gpupdate /force»`,R`Za krótkie hasło nowego konta daje błąd`],
 pam:'secpol.msc = to samo co Default Domain Policy, tylko na jednym komputerze.',

  ['Ustawienie jest szare','Komputer jest w domenie i domena je nadpisuje. Zmień w domenie.'],
  ['Brak secpol.msc','To Windows Home. Nie ma tej konsoli.']],
 cmds:[['cmd',R`net accounts /minpwlen:6 /lockoutthreshold:3`]]},

{id:'w11-zapora', os:'w11', t:'Zapora i ping',
 cel:'Pozwól na ping bez wyłączania zapory.',
 exam:['zezwól na ping','zablokuj port'],
 sec:[
  ['1. Włącz ping',[
   R`{Win}+{R} > «wf.msc» > {Enter}`,
   R`Po lewej {Reguły przychodzące}`,
   R`Znajdź {Udostępnianie plików i drukarek (żądanie echa — ruch przychodzący ICMPv4)} (kliknij nagłówek {Nazwa}: lista A–Z)`,
   R`Są 2 takie (różne profile): prawy klik na każdej > {Włącz regułę}`,
   R`Zielony ptaszek = włączona`]],
  ['2. Nowa reguła portu',[
   R`Po lewej {Reguły przychodzące}, po prawej {Nowa reguła…}`,
   R`{Port} > {Dalej}`,
   R`{TCP}, {Określone porty lokalne}: «80» > {Dalej}`,
   R`{Zezwalaj na połączenie} albo {Blokuj połączenie} > {Dalej}`,
   R`Zaznacz {Domena}, {Prywatny}, {Publiczny} > {Dalej}`,
   R`{Nazwa}: z arkusza > {Zakończ}`]],
  ['3. Zablokuj program',[
   R`{Nowa reguła…} > {Program} > {Dalej} > {Ta ścieżka programu} > {Przeglądaj…} > plik .exe > {Dalej}`,
   R`{Blokuj połączenie} > {Dalej} > profile > {Dalej} > nazwa > {Zakończ}`]]],
 tip:R`Nie wyłączaj całej zapory. Włącz jedną regułę.`,
 check:[R`Z drugiego komputera «ping» odpowiada`],
 pam:'PRZYCHODZĄCE = ruch do mnie. Ping = ICMPv4 echo. Nie wyłączaj zapory, włącz jedną regułę.',
 errs:[['Reguła w Wychodzących','Zrób ją w Regułach przychodzących.'],
  ['ICMPv6 zamiast ICMPv4','Włącz wersję ICMPv4.'],
  ['Reguła tylko dla profilu Domena','Właściwości reguły > Zaawansowane > zaznacz wszystkie profile.'],
  ['Wyłączona cała zapora','Włącz ją z powrotem. Możesz stracić punkty.']],
 cmds:[['cmd',R`netsh advfirewall firewall add rule name="Ping" protocol=icmpv4:8,any dir=in action=allow`]]},

/* ================= LINUX: openSUSE Leap 16 ================= */
{id:'lx-start', os:'lx', t:'Start: Terminal i Cockpit',
 cel:'W Leap 16 nie ma YaST. Klikasz w Cockpit (panel w przeglądarce) albo piszesz w Terminalu.',
 exam:['terminal','sudo','Cockpit'],
 sec:[
  ['1. Otwórz Terminal i zostań adminem',[
   R`Menu aplikacji (albo klawisz {Super}) > wpisz «terminal» > {Enter}`,
   R`ZAWSZE NAJPIERW: «sudo -i» > hasło > {Enter}`,
   R`Hasło się nie wyświetla przy pisaniu, to normalne`,
   R`Znak zachęty kończy się na {#}: jesteś adminem. W żadnym poleceniu nie piszesz już „sudo”`,
   R`Mniej pisania: {Tab} dopisuje resztę polecenia albo ścieżki (np. «systemctl ena» + {Tab})`,
   R`Strzałka {↑} przywołuje poprzednie polecenie: popraw je i {Enter}`,
   R`Wklejanie: {Ctrl}+{Shift}+{V}. Przerwanie polecenia: {Ctrl}+{C}`]],
  ['2. Edytor nano (będziesz go używać)',[
   R`Otwórz plik: «nano /etc/nazwa_pliku»`,
   R`Piszesz od razu. Strzałki = ruch kursora`,
   R`Szukanie: {Ctrl}+{W} > słowo > {Enter}`,
   R`Zapis: {Ctrl}+{O} > {Enter}`,
   R`Wyjście: {Ctrl}+{X}`]],
  ['3. Usługi (systemctl)',[
   R`Start teraz + przy starcie systemu: «systemctl enable --now nazwa»`,
   R`Czy działa: «systemctl status nazwa» > szukaj zielonego {active (running)} > wyjście {q}`,
   R`Po zmianie pliku konfiguracyjnego: «systemctl restart nazwa»`]],
  ['4. Cockpit (jeśli wolisz klikać)',[
   R`«zypper in -y cockpit» (egzamin bez internetu: najpierw «rpm -q cockpit». Jest wersja = pomiń instalację)`,
   R`«systemctl enable --now cockpit.socket»`,
   R`Firefox: «https://localhost:9090»`,
   R`Ostrzeżenie o certyfikacie > {Zaawansowane} > {Akceptuję ryzyko i kontynuuję}`,
   R`Zaloguj się swoim kontem > u góry {Ograniczony dostęp (Limited access)} > {Włącz dostęp administracyjny} > hasło`]]],
 tip:R`Wklejanie w Terminalu: {Ctrl}+{Shift}+{V}. Samo {Ctrl}+{V} nie działa.`,
 check:[R`«whoami» pokazuje Twój login`,R`Cockpit otwiera się na «https://localhost:9090»`],
 pam:'sudo = zrób jako admin. Cockpit = port 9090. Wklej w Terminalu = Ctrl+Shift+V.',
 errs:[['„Permission denied”','Dodaj przed poleceniem.'],
  ['„command not found”','Literówka albo brak programu: «zypper in -y nazwa» (egzamin bez internetu: najpierw «rpm -q nazwa». Jest wersja = pomiń instalację).'],
  ['Cockpit się nie otwiera','«systemctl enable --now cockpit.socket». Z innego komputera dodaj cockpit w zaporze.'],
  ['W Cockpit wszystko szare','Kliknij u góry Ograniczony dostęp > Włącz dostęp administracyjny.'],
  ['nie przyjmuje hasła','Spróbuj hasła roota. openSUSE często o nie pyta.']],
 extra:[['p',R`Z Windowsa: «https://192.168.10.30:9090» (trzeba otworzyć «cockpit» w zaporze).`],['p',R`Napisy w Cockpit bywają po angielsku. Dlatego w nawiasach jest angielska nazwa.`]],
 cmds:[['sh',R`zypper in -y cockpit
systemctl enable --now cockpit.socket
firewall-cmd --permanent --add-service=cockpit
firewall-cmd --reload`]]},

{id:'lx-prawa', os:'lx', t:'Uprawnienia (chmod, chown)',
 cel:'Kto może czytać i zapisywać w folderze.',
 exam:['właściciel','grupa','chmod','chown'],
 sec:[
  ['1. Folder',[
   R`«mkdir /dane»`,
   R`Folder w folderze naraz: «mkdir -p /dane/projekt»`]],
  ['2. Właściciel i grupa',[
   R`«chown jkowalski:klasa /dane» (najpierw właściciel, po dwukropku grupa)`,
   R`Razem z całą zawartością: «chown -R jkowalski:klasa /dane»`,
   R`Tylko grupa: «chgrp klasa /dane»`]],
  ['3. Prawa liczbami',[
   R`«chmod 770 /dane»`,
   R`Cyfry: 1. właściciel, 2. grupa, 3. reszta. r=4, w=2, x=1 (7 = rwx, 5 = r-x, 0 = nic)`,
   R`Popularne: «700» tylko właściciel, «750» grupa czyta, «755» wszyscy czytają, «644» plik tylko do odczytu`]],
  ['4. Prawa literami (gdy arkusz pisze „dodaj”, „odbierz”)',[
   R`Dodaj grupie zapis: «chmod g+w /dane»`,
   R`Odbierz innym wszystko: «chmod o-rwx /dane»`,
   R`u = właściciel, g = grupa, o = inni, a = wszyscy; + dodaj, - odbierz`]],
  ['5. Bity specjalne (rzadko)',[
   R`Nowe pliki dostają grupę folderu (SGID): «chmod g+s /dane»`,
   R`Każdy usuwa tylko swoje pliki (sticky): «chmod +t /dane»`]],
  ['6. Sprawdź',[
   R`«ls -ld /dane»`]]],
 map:{t:'Arkusz mówi → liczba',rows:[
   ['właściciel i grupa: wszystko, inni: nic',R`«770»`],
   ['właściciel: wszystko, grupa: czyta, inni: nic',R`«750»`],
   ['tylko właściciel',R`«700»`],
   ['plik: właściciel zapisuje, reszta czyta',R`«644»`]]},
 tip:R`Liczysz tak: «r=4», «w=2», «x=1». rwx = 4+2+1 = 7, r-x = 5.`,
 check:[R`«ls -ld /dane» pokazuje «drwxrwx---»`],
 pam:'r=4, w=2, x=1. Kolejność U-G-O: User, Group, Others = „Uczeń Gra Online”.',
 errs:[['chmod bez sudo','Dodaj sudo.'],
  ['Folder bez x','Nie da się do niego wejść. Daj 770 albo 750.'],
  ['Zła kolejność cyfr','Właściciel, grupa, inni.'],
  ['chown: „invalid group”','Najpierw «groupadd klasa».']],
 extra:[['table',['Cyfra','Prawa'],[['7','rwx (wszystko)'],['6','rw- (czyta, pisze)'],['5','r-x (czyta, wchodzi)'],['4','r-- (tylko czyta)'],['0','--- (nic)']]],['p',R`Też dla plików w środku: dodaj «-R», np. «chmod -R 770 /dane».`]],
 cmds:[]},

{id:'lx-dyski', os:'lx', t:'Partycje',
 fields:[['Utwórz partycję (Create partition)',[['Nazwa (Name)','DANE'],['Punkt montowania (Mount point)','/backup'],['Typ (Type)','ext4'],['Rozmiar (Size)','5 GiB']]]],
 cel:'Nowa partycja, system plików i montowanie.',

 sec:[
