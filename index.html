let FC = null, fcFilter = 'all';
function newDeck(){
  const cards = QUIZ.map(q=>({q:q[0], a:q[1], lid:q[3]})).concat(L.filter(l=>l.pam).map(l=>({q:'🧠 '+l.t, a:l.pam, lid:l.id})));
  const deck = shuffle(cards.filter(c=>fcFilter==='all' || L.find(x=>x.id===c.lid)?.os===fcFilter));
  FC = {deck, show:false, known:0, total:deck.length};
}
function fiszki(){
  if(!FC) newDeck();
  const os = fcFilter==='all' ? 'w11' : fcFilter;
  let h = '<div class="wrap" style="'+accVars(os)+'"><div class="lhead"><h1>Fiszki</h1><p class="cel">Przeczytaj pytanie, odpowiedz w głowie, odkryj. Umiesz? Fiszka znika. Nie? Wróci.</p></div>'+
   '<div class="filter fcf">'+[['all','Wszystko'],['ws','Serwer'],['w11','Windows 11'],['lx','Linux']].map(([k,t])=>'<button data-ff="'+k+'" class="'+(fcFilter===k?'on':'')+'">'+t+'</button>').join('')+'</div>'+
   '<div class="qtop"><span>Umiesz '+FC.known+' z '+FC.total+'</span><span>Zostało: '+FC.deck.length+'</span></div><div class="bar"><i style="width:'+(FC.total?Math.round(FC.known/FC.total*100):0)+'%"></i></div>';
  if(!FC.deck.length) return h+'<div class="fc"><div class="q">Wszystko umiesz! 🎉</div><button class="btn pri" id="fcRestart">Jeszcze raz od początku</button></div></div>';
  const c = FC.deck[0], l = L.find(x=>x.id===c.lid);
  h += '<div class="fc"><div class="q">'+fmt(c.q)+'</div>'+(FC.show?'<div class="a">'+fmt(c.a)+'</div>'+(l?'<a class="src" href="#'+l.id+'">lekcja: '+esc(l.t)+'</a>':''):'')+'</div>'+
   '<div class="fcbtns">'+(FC.show?'<button class="btn" id="fcAgain">↻ Jeszcze nie umiem</button><button class="btn on" id="fcOk">✓ Umiem</button>':'<button class="btn pri" id="fcShow">Pokaż odpowiedź</button>')+'</div>';
  return h+'</div>';
}

/* kalkulator */
const ip2n = s => { const p=s.split('.'); if(p.length!==4) return null; let n=0; for(const x of p){ if(!/^\d{1,3}$/.test(x)||+x>255) return null; n=n*256+ +x; } return n; };
const n2ip = n => [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const maskN = c => c===0?0:(0xFFFFFFFF << (32-c))>>>0;
const bin = n => n.toString(2).padStart(32,'0');
function calcRes(){
  const parts = $('#ipIn').value.trim().split(/[\s\/]+/);
  const ip = ip2n(parts[0]||''); let c = null;
  if(parts[1]!==undefined){
    if(/^\d{1,2}$/.test(parts[1]) && +parts[1]<=32) c=+parts[1];
    else { const m=ip2n(parts[1]); if(m!==null){ const b=bin(m); if(/^1*0*$/.test(b)) c=b.indexOf('0')<0?32:b.indexOf('0'); } }
  }
  if(ip===null||c===null) return '<p class="err">Wpisz np. 192.168.10.37/26 albo 10.0.5.1 255.255.0.0</p>';
  const m = maskN(c), net = (ip & m)>>>0, bc = (net | (~m>>>0))>>>0;
  const hosts = c>=31 ? (c===32?1:2) : Math.pow(2,32-c)-2;
  let out = '<div class="kv">'+[['Maska',n2ip(m)],['Adres sieci',n2ip(net)+'/'+c],['Rozgłoszeniowy',n2ip(bc)],['Pierwszy host',n2ip(c>=31?net:net+1)],['Ostatni host',n2ip(c>=31?bc:bc-1)],['Liczba hostów',hosts.toLocaleString('pl-PL')]].map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div>';
  const n = parseInt($('#splitIn').value,10);
  if(n>1){
    const bits = Math.ceil(Math.log2(n)), nc = c+bits;
    if(nc>30) out += '<p class="err">Za dużo podsieci dla /'+c+'.</p>';
    else{
      const size = Math.pow(2,32-nc), count = Math.pow(2,bits), show = Math.min(count,64);
      let rows=''; for(let i=0;i<show;i++){ const s=(net+i*size)>>>0, e=(s+size-1)>>>0; rows+='<tr><td class="num">'+(i+1)+'</td><td class="num">'+n2ip(s)+'/'+nc+'</td><td class="num">'+n2ip(s+1)+' – '+n2ip(e-1)+'</td><td class="num">'+n2ip(e)+'</td></tr>'; }
      out += '<h2 style="font-size:17px">'+count+' podsieci /'+nc+', maska '+n2ip(maskN(nc))+'</h2><div class="tbl"><table><thead><tr><th>#</th><th>Sieć</th><th>Hosty</th><th>Rozgł.</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
  }
  return out;
}

const PAGES = {sciaga:'Ściąga poleceń', podsieci:'Kalkulator podsieci', bledy:'Błędy i scenariusze', egzamin:'Próbny egzamin', gpo:'Zasady grupy A–Z'};
const nz = s => String(s).toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'');
const toks = s => nz(s).split(/[^a-z0-9]+/).filter(Boolean);
const SOISK_N = SOISK.map(([t,ids])=>({t, ids, n:' '+toks(t).join(' ')+' '}));
function soiskHits(q){
  const w = toks(q); if(!w.length) return [];
  const full = ' '+w.join(' ')+' ';
  const hits = SOISK_N.filter(x=>w.every(t=>x.n.includes(' '+t) ));
  hits.sort((a,b)=>(b.n.includes(full)?1:0)-(a.n.includes(full)?1:0) || a.t.length-b.t.length);
  return hits.slice(0,8);
}
function soiskLink(id){
  const l = L.find(x=>x.id===id);
  if(l) return '<a href="#'+l.id+'" style="'+accVars(l.os)+'"><span class="chip">'+COURSE[l.os].short+'</span><b>'+l.t+'</b></a>';
  return '<a href="#'+id+'"><span class="chip">Narzędzie</span><b>'+PAGES[id]+'</b></a>';
}
const IDX = L.map(l=>({l, txt:nz(l.t+' '+l.cel+' '+JSON.stringify([l.exam,l.sec,l.map,l.tip,l.check,l.errs,l.pam,l.fields]))}));
function search(q){
  const w = nz(q).split(/\s+/).filter(t=>t && t!=='-');
  const hits = IDX.filter(x=>w.every(t=>x.txt.includes(t))).map(x=>x.l);
  const sh = (w.length>=2 || !hits.length) ? soiskHits(q) : [];
  const ch = CHEATS.filter(c=>w.every(t=>nz(c[0]+' '+c[1]).includes(t)));
  let h = '<div class="wrap"><div class="lhead"><h1>„'+esc(q)+'”</h1></div>';
  if(sh.length) h += '<section class="soisk"><h2>Odpowiednik z soisk.info</h2>'+sh.map(x=>'<div class="sk"><div class="skt"><span>soisk.info</span>'+esc(x.t)+'</div><div class="skl"><i>u nas →</i>'+x.ids.map(soiskLink).join('')+'</div></div>').join('')+'</section>';
  if(!hits.length && !ch.length && !sh.length) h += '<p class="empty">Nic. Spróbuj: DHCP, ping, partycja, profil albo tytuł z soisk.info.</p>';
  if(sh.length && hits.length) h += '<h2 class="soh">Lekcje ze słowem „'+esc(q)+'”</h2>';
  if(hits.length) h += '<div class="res">'+hits.map(l=>'<a href="#'+l.id+'" style="'+accVars(l.os)+'"><span><span class="chip">'+COURSE[l.os].short+'</span></span><b>'+l.t+'</b><small>'+l.cel+'</small></a>').join('')+'</div>';
  if(ch.length) h += '<div class="tbl cs"><table><tbody>'+ch.map(c=>'<tr><td><button class="cp" data-t="'+esc(c[0])+'">'+esc(c[0])+'</button></td><td>'+c[1]+'</td></tr>').join('')+'</tbody></table></div>';
  return h+'</div>';
}

/* router */
let curLesson = null;
function route(){
  CODES.length = 0;
  const id = (location.hash||'#start').slice(1);
  const l = L.find(x=>x.id===id); curLesson = l||null;
  let html, cur = id;
  if(l) html = lesson(l);
  else if(id==='egzamin') html = exam();
  else if(id==='test') html = quiz();
  else if(id==='bledy') html = bledy();
  else if(id==='gpo') html = gpoPage();
  else if(id==='fiszki') html = fiszki();
  else if(id==='sciaga') html = cheat();
  else if(id==='podsieci') html = subnet();
  else { html = home(); cur='start'; }
  $('#main').innerHTML = html;
  renderSide(cur);
  if(id==='podsieci') $('#calcOut').innerHTML = calcRes();
  document.title = l ? l.t+' · Konsola Admina' : 'Konsola Admina';
  closeMenu();
}
function closeMenu(){ $('#side').classList.remove('open'); $('#backdrop').classList.remove('open'); }

  if(e.target.closest('#fcOk')){ FC.deck.shift(); FC.known++; FC.show=false; $('#main').innerHTML=fiszki(); return; }

  if(e.target.closest('#qNext') && Q){ Q.i++; Q.pick=null; if(Q.i>=Q.qs.length){ const b=best(); if(b===null||Q.score>b) save('ka-quiz',Q.score); } $('#main').innerHTML=quiz(); window.scrollTo(0,0); return; }
  if(e.target.closest('#qAgain')){ newQuiz(); $('#main').innerHTML=quiz(); return; }
});

/* tryb Gen-Z: film w prawym dolnym rogu */
const GENZ_ID = 'QFzfgB34cCk';
let genzWin = null, genzStop = null;
function openGenzVideo(){
  const w = 440, hh = 280;
  const left = (screen.availLeft||0) + screen.availWidth - w - 16, top = (screen.availTop||0) + screen.availHeight - hh - 70;
  try{ genzWin = window.open('https://www.youtube.com/watch?v='+GENZ_ID, 'genzVideo', 'popup=yes,width='+w+',height='+hh+',left='+left+',top='+top); }catch(e){ genzWin = null; }
  const msg = document.getElementById('genzMsg');
  if(msg) msg.textContent = genzWin ? 'film gra w okienku obok' : 'przeglądarka zablokowała okienko – zezwól na wyskakujące okna';
}
function runGenz(cv){
  const c = cv.getContext('2d'), W = cv.width = 600, H = cv.height = 338, HOR = H*0.3;
  let t = 0, lane = 1, px = 1, jump = 0, score = 0, obs = [], raf;
  const P = (l,z) => { const y = H-(H-HOR)*z, sp = (1-z)*W*0.27+W*0.02; return {x:W/2+(l-1)*sp, y, s:(1-z)*0.85+0.15}; };
  function frame(){
    t++; score++;
    const g = c.createLinearGradient(0,0,0,HOR); g.addColorStop(0,'#5ec8ff'); g.addColorStop(1,'#c9f0ff');
    c.fillStyle = g; c.fillRect(0,0,W,HOR);
    c.fillStyle = '#8a7f74'; c.fillRect(0,HOR,W,H-HOR);
    for(let b=0;b<8;b++){ const bx = ((b*97 - t*1.5)%700+700)%700-60; c.fillStyle = ['#ff7a59','#ffd166','#06d6a0','#a78bfa'][b%4]; c.fillRect(bx, HOR-30-(b%3)*14, 46, 30+(b%3)*14); }
    for(let i=0;i<14;i++){ const z = 1-(((i/14)+(t*0.012))%1); const a = P(-0.6,z), b = P(2.6,z); c.strokeStyle = '#5b4636'; c.lineWidth = 2+6*(1-z); c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    for(const r of [-0.25,0.25,0.75,1.25,1.75,2.25]){ const a = P(r,0), b = P(r,1); c.strokeStyle = '#d9d9d9'; c.lineWidth = 3; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    if(t%38===0) obs.push({l:Math.floor(Math.random()*3), z:1, k:Math.random()<0.35?'coin':'box'});
    obs.forEach(o=>o.z -= 0.011);
    const danger = obs.find(o=>o.k==='box' && o.l===lane && o.z<0.38 && o.z>0.1);
    if(danger && !jump){ const free = [0,1,2].filter(l=>!obs.some(o=>o.k==='box'&&o.l===l&&o.z<0.45&&o.z>0.05)); if(free.length) lane = free.sort((a,b)=>Math.abs(a-lane)-Math.abs(b-lane))[0]; else jump = 1; }
    obs = obs.filter(o=>{ if(o.k==='coin' && o.l===lane && o.z<0.1){ score+=50; return false; } return o.z>-0.05; });
    obs.slice().sort((a,b)=>b.z-a.z).forEach(o=>{ const q = P(o.l,o.z);
      if(o.k==='box'){ const s = 70*q.s; c.fillStyle = '#e63946'; c.fillRect(q.x-s/2,q.y-s,s,s); c.fillStyle = '#fff'; c.fillRect(q.x-s/2,q.y-s*0.62,s,s*0.14); }
      else { c.fillStyle = '#ffd60a'; c.beginPath(); c.arc(q.x,q.y-30*q.s,12*q.s,0,7); c.fill(); } });
    px += (lane-px)*0.18; if(jump){ jump += 1; if(jump>34) jump = 0; }
    const me = P(px,0.06), jy = jump ? Math.sin(jump/34*Math.PI)*70 : 0, bob = Math.sin(t*0.4)*3;
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(me.x,me.y,26,8,0,0,7); c.fill();
    const by = me.y-jy+bob;
    c.fillStyle = '#3a86ff'; c.fillRect(me.x-16,by-62,32,40);
    c.fillStyle = '#222'; c.fillRect(me.x-14,by-22,10,22); c.fillRect(me.x+4,by-22,10,22);
    c.fillStyle = '#ffcf9f'; c.beginPath(); c.arc(me.x,by-76,15,0,7); c.fill();
    c.fillStyle = '#ff006e'; c.fillRect(me.x-16,by-92,32,10);
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(10,10,190,40); c.fillStyle = '#fff'; c.font = 'bold 24px monospace'; c.fillText('WYNIK '+score, 20, 39);
    raf = requestAnimationFrame(frame);
  }
  frame(); return () => cancelAnimationFrame(raf);
}
function setGenz(on){
  document.body.classList.toggle('genz', on);
  const b = $('#genzBtn'); b.setAttribute('aria-pressed', on); b.innerHTML = '🛹 <span>'+(on?'Tryb Gen-Z: WŁ':'Tryb Gen-Z')+'</span>';
  let box = document.getElementById('genzBox');
  if(on && !box){
    box = document.createElement('div'); box.id = 'genzBox'; box.className = 'genz-box';
    box.innerHTML = '<canvas id="genzCv" aria-label="Animacja Gen-Z"></canvas><div class="genz-bar"><button id="genzVid">▶ film z YouTube</button><span id="genzMsg"></span><button id="genzClose" aria-label="Wyłącz tryb Gen-Z">✕</button></div>';
    document.body.appendChild(box);
    genzStop = runGenz(box.querySelector('#genzCv'));
    box.querySelector('#genzVid').addEventListener('click', openGenzVideo);
    box.querySelector('#genzClose').addEventListener('click', ()=>setGenz(false));
    openGenzVideo();
  } else if(!on && box){
    if(genzStop) genzStop(); genzStop = null; box.remove();
    try{ if(genzWin && !genzWin.closed) genzWin.close(); }catch(e){} genzWin = null;
  }
}
$('#genzBtn').addEventListener('click',()=>setGenz(!document.body.classList.contains('genz')));
document.body.classList.toggle('pic', pic);
if(pic){ $('#picBtn').setAttribute('aria-pressed','true'); $('#picBtn').innerHTML='🖼️ <span>Tryb analfabety: WŁ</span>'; }
